<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>通晓</title>
<style>
  :root{--navy:#0B3B72;--navy-deep:#082B55;--red:#C0111D;--bg:#F3F5F8;--card:#FFFFFF;--line:#DCE3EC;--ink:#1A1A1A;--ink-2:#4A5568;--ink-3:#8A94A3;--serif:"Songti SC",SimSun,serif;--sans:"Microsoft YaHei",-apple-system,"Segoe UI",sans-serif}
  *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background-color:var(--bg);background-image:radial-gradient(circle at 1px 1px,rgba(11,59,114,.07) 1px,transparent 1.4px);background-size:16px 16px;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.9;-webkit-font-smoothing:antialiased}
  .topbar{height:72px;background:var(--navy);border-bottom:3px solid var(--red);color:var(--card);display:flex;align-items:center;padding:0 24px}.topbar-inner{width:100%;max-width:820px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand-lockup{display:flex;align-items:center;min-width:0;white-space:nowrap}.brand-name{font:700 26px/1.3 var(--serif);letter-spacing:.08em}.brand-rule{width:1px;height:14px;background:var(--card);opacity:.55;margin:0 12px}.brand-subtitle{font:13px/1.3 var(--sans);color:var(--card);opacity:.85}.stats{display:flex;align-items:center;gap:8px;color:var(--card);opacity:.82;font-size:12px;white-space:nowrap}.stats[hidden]{display:none}.status-dot{width:8px;height:8px;border-radius:50%;background:var(--card);opacity:.55}.status-dot.online{opacity:1}
  .wrap{max-width:820px;margin:0 auto;padding:0 24px 0}.hero{padding-top:64px;margin-bottom:48px}.hero h1{margin:0;color:var(--navy);font:400 34px/1.3 var(--serif)}.hero h1:after{content:"";display:block;width:46px;height:4px;background:var(--red);margin-top:16px;clip-path:polygon(0 0,100% 0,87% 50%,100% 100%,0 100%)}.hero p{margin:12px 0 0;color:var(--ink-3);font-size:13px;line-height:1.9}
  .search-row{display:flex;align-items:center;gap:12px;margin-bottom:40px}.search-input{height:52px;min-width:0;flex:1;padding:0 14px;border:1px solid var(--line);border-radius:2px;outline:0;background:var(--card);color:var(--ink);font:15px/1.9 var(--sans);transition:border-color 180ms ease-out,box-shadow 180ms ease-out}.search-input::placeholder{color:var(--ink-3)}.search-input:focus{border:2px solid var(--navy);box-shadow:0 0 0 3px rgba(11,59,114,.08)}.search-submit{width:52px;height:52px;flex:0 0 52px;border:0;border-radius:4px;display:grid;place-items:center;background:var(--navy);color:var(--card);cursor:pointer;transition:background-color 180ms ease-out,opacity 180ms ease-out}.search-submit:hover{background:var(--navy-deep)}.search-submit:disabled{opacity:.4;cursor:default}.search-submit svg{width:20px;height:20px}
  .examples-title,.sources-title{margin:0 0 8px;padding-left:12px;border-left:3px solid var(--red);color:var(--navy);font-size:12px;line-height:1.4;letter-spacing:.15em;font-weight:700}.examples{display:grid;grid-template-columns:1fr 1fr;gap:0 32px;margin-bottom:48px}.example{min-width:0;display:flex;align-items:center;gap:12px;border:0;border-bottom:1px solid var(--line);padding:14px 8px;background:transparent;color:var(--ink);font:15px/1.9 var(--sans);text-align:left;cursor:pointer;transition:background-color 180ms ease-out,color 180ms ease-out}.example:hover{background:var(--bg)}.example:hover .example-no{color:var(--navy)}.example-no{font:13px/1.3 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--ink-3);flex:0 0 22px}.example-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.example svg{width:14px;height:14px;flex:0 0 14px;color:var(--ink-3)}
  .answer-block{position:relative;margin-top:8px;border:1px solid var(--line);border-left:3px solid var(--red);padding:24px 24px 24px 44px;background:var(--card);animation:answer-in 220ms ease-out both}
  .answer-block:before{content:"";position:absolute;left:17px;top:22px;bottom:22px;width:7px;background:radial-gradient(circle,var(--navy) 2.1px,transparent 2.4px) 0 0/7px 22px repeat-y;opacity:.25;pointer-events:none}
  .stamp{position:absolute;right:16px;top:13px;padding:5px 9px 4px;border:1px solid var(--red);box-shadow:inset 0 0 0 2px var(--card),inset 0 0 0 3px var(--red);color:var(--red);font:700 11px/1.2 var(--serif);letter-spacing:.24em;opacity:0;transform:rotate(-8deg) scale(1.5);animation:stamp-in 300ms cubic-bezier(.2,.9,.3,1.4) 160ms both;pointer-events:none}
  .answer-label{margin:0 0 8px;padding-right:88px;color:var(--ink-3);font-size:12px;line-height:1.3;letter-spacing:.15em}.answer-text{color:var(--ink);font-size:15px;line-height:1.9;white-space:pre-wrap}.answer-emphasis{font-weight:700}.num,.hl{color:var(--red);font-weight:700;font-style:normal}.cite{position:relative;top:-.25em;margin:0 2px;color:var(--red);font:700 12px/1 var(--sans);text-decoration:none;cursor:pointer}.cite:hover{text-decoration:underline}.feedback-area{margin-top:20px;font-size:13px}.feedback-btn,.feedback-send{border:1px solid var(--line);background:var(--card);color:var(--ink-2);padding:6px 12px;cursor:pointer}.feedback-box{margin-top:8px;display:flex;gap:8px;align-items:center}.feedback-box textarea{width:240px;min-height:34px;border:1px solid var(--line);padding:6px;resize:vertical;font:13px var(--sans)}.feedback-status{color:var(--ink-3)}.notice{margin-top:16px;border-left:3px solid var(--red);padding:12px 16px;background:var(--card);color:var(--ink-2);font-size:13px;line-height:1.9}
  .sources{margin-top:32px}.sources-heading{display:flex;align-items:baseline;justify-content:space-between;gap:16px}.sources-note{color:var(--ink-3);font-size:11px;white-space:nowrap}.source-item{display:grid;grid-template-columns:24px 1fr;gap:12px;padding:16px 10px;background:var(--card);border:1px solid transparent;border-bottom-color:var(--line);scroll-margin-top:24px;animation:source-in 200ms ease-out both}.source-item:hover{border-color:var(--navy)}.source-item.flash{background:var(--bg)}.source-number{width:22px;height:22px;line-height:22px;text-align:center;background:var(--red);color:var(--card);font:13px/22px ui-monospace,SFMono-Regular,Consolas,monospace}.source-main{min-width:0}.source-title{color:var(--ink);font-size:15px;line-height:1.7}.source-title a{color:inherit;text-decoration:none}.source-title a:hover{text-decoration:underline;text-underline-offset:3px}.source-count{display:inline-block;margin-left:8px;padding:0 6px;border:1px solid var(--navy);color:var(--navy);font-size:11px;line-height:20px;white-space:nowrap}.same-file{margin-left:8px;color:var(--ink-3);font-size:12px;white-space:nowrap}.source-detail{margin-top:4px;color:var(--ink-3);font-size:12px;line-height:1.7}.duplicate-cross{color:var(--ink-3);font-size:12px;line-height:1.7}.source-score{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:8px;color:var(--ink-3);font:12px/1.3 ui-monospace,SFMono-Regular,Consolas,monospace}.score-bar{width:60px;height:2px;background:var(--line);overflow:hidden}.score-bar i{display:block;height:100%;background:var(--navy)}details{margin-top:8px}details summary{color:var(--navy);font-size:13px;line-height:1.9;cursor:pointer;list-style:none}details summary::-webkit-details-marker{display:none}details summary:before{content:"▸ ";font-size:11px}details[open] summary:before{content:"▾ "}.evidence{margin-top:8px;padding:16px;background:var(--bg);color:var(--ink-2);font-size:13px;line-height:1.9;white-space:pre-wrap}.dup{color:var(--ink-3);font-size:12px}.loading{text-align:center;color:var(--ink-3);padding:48px 0;font-size:13px}.error-message{border-left:3px solid var(--red);padding:12px 16px;background:var(--card);color:var(--ink-2);font-size:13px}.expanded-note{margin-top:16px;color:var(--ink-3);font-size:12px}footer{margin:64px calc(50% - 50vw) 0;padding:24px max(24px,calc(50vw - 410px)) 28px;background:var(--navy);color:var(--card);opacity:.8;font-size:12px;line-height:1.9;text-align:center}
  @keyframes answer-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes source-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes stamp-in{from{opacity:0;transform:rotate(-8deg) scale(1.5)}to{opacity:1;transform:rotate(-8deg) scale(1)}}
  /* ===== 顶栏视图切换 ===== */
  .nav-switch{display:flex;gap:2px;padding:3px;background:rgba(255,255,255,.13);border-radius:3px;flex:0 0 auto}
  .nav-tab{padding:4px 15px;border:0;border-radius:2px;background:transparent;color:var(--card);opacity:.72;font:13px/1.7 var(--sans);cursor:pointer;white-space:nowrap;transition:background-color 180ms ease-out,opacity 180ms ease-out}
  .nav-tab:hover{opacity:1}
  .nav-tab[aria-selected="true"]{background:var(--card);color:var(--navy);opacity:1;font-weight:700}

  /* ===== 地图视图 ===== */
  body[data-view="map"]{overflow:hidden}
  body[data-view="map"] .wrap{display:none}
  body[data-view="map"] .topbar-inner{max-width:100%}
  .map-shell{display:none;height:calc(100vh - 75px);min-height:480px}
  body[data-view="map"] .map-shell{display:grid;grid-template-columns:296px 1fr}
  .map-side{display:flex;flex-direction:column;min-height:0;background:var(--card);border-right:1px solid var(--line)}
  .map-side-head{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
  .map-side-title{margin:0 0 10px;padding-left:10px;border-left:3px solid var(--red);color:var(--navy);font:700 12px/1.4 var(--sans);letter-spacing:.15em}
  .map-search{position:relative}
  .map-search input{width:100%;height:38px;padding:0 30px 0 11px;border:1px solid var(--line);border-radius:2px;background:var(--bg);color:var(--ink);font:14px/1.8 var(--sans);outline:0;transition:border-color 160ms ease-out,background-color 160ms ease-out}
  .map-search input:focus{border-color:var(--navy);background:var(--card);box-shadow:0 0 0 3px rgba(11,59,114,.07)}
  .map-search .clear{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:24px;height:24px;border:0;background:transparent;color:var(--ink-3);cursor:pointer;font:16px/1 var(--sans);padding:0}
  .map-search .clear[hidden]{display:none}
  .map-cats{display:flex;flex-wrap:wrap;gap:5px;padding:10px 16px;border-bottom:1px solid var(--line)}
  .cat-chip{padding:1px 9px;border:1px solid var(--line);border-radius:2px;background:var(--card);color:var(--ink-2);font:12px/1.9 var(--sans);cursor:pointer;transition:background-color 140ms ease-out,color 140ms ease-out,border-color 140ms ease-out}
  .cat-chip[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:var(--card)}
  .map-list{flex:1;min-height:0;overflow-y:auto;padding:4px 0 28px}
  .map-group-name{padding:12px 16px 4px;color:var(--ink-3);font:11px/1.6 var(--sans);letter-spacing:.18em}
  .place-row{display:flex;align-items:flex-start;gap:9px;width:100%;padding:8px 16px;border:0;border-left:3px solid transparent;background:transparent;color:var(--ink);font:14px/1.7 var(--sans);text-align:left;cursor:pointer;transition:background-color 140ms ease-out,border-color 140ms ease-out}
  .place-row:hover{background:var(--bg)}
  .place-row.on{border-left-color:var(--red);background:var(--bg)}
  .place-dot{width:7px;height:7px;flex:0 0 7px;margin-top:8px;border-radius:50%;background:var(--ink-3)}
  .place-row.on .place-dot{background:var(--red)}
  .place-row-text{min-width:0;flex:1}
  .place-row-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .place-row-sub{display:block;color:var(--ink-3);font-size:12px;line-height:1.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .map-empty{padding:28px 16px;color:var(--ink-3);font-size:13px;text-align:center;line-height:1.9}
  .map-plan-link{margin:0;padding:12px 16px 16px;border-top:1px solid var(--line);color:var(--ink-3);font-size:12px;line-height:1.8}
  .map-plan-link a{color:var(--navy);text-decoration:none;border-bottom:1px solid var(--navy)}
  .map-canvas{position:relative;overflow:hidden;background:#E9ECF0;cursor:grab;touch-action:none}
  .map-canvas.dragging{cursor:grabbing}
  .map-stage{position:absolute;top:0;left:0;width:100%;height:100%;transform-origin:0 0;will-change:transform}
  .map-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;user-select:none;-webkit-user-drag:none;pointer-events:none;image-rendering:auto}
  .marker-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .mk{position:absolute;transform:translate(-50%,-100%);border:0;background:transparent;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;pointer-events:auto}
  .mk-pin{width:20px;height:20px;border-radius:50% 50% 50% 2px;transform:rotate(45deg);background:var(--navy);border:2px solid var(--card);box-shadow:0 1px 4px rgba(11,59,114,.4);transition:background-color 160ms ease-out,transform 160ms ease-out}
  .mk-label{margin-top:3px;padding:0 5px;background:rgba(255,255,255,.94);border:1px solid var(--line);color:var(--navy);font:11px/1.65 var(--sans);white-space:nowrap;opacity:0;transition:opacity 160ms ease-out;pointer-events:none}
  .mk:hover .mk-label,.mk.on .mk-label{opacity:1}
  .mk.on .mk-pin{background:var(--red);transform:rotate(45deg) scale(1.16)}
  .mk.on{z-index:6}
  .mk.dim{opacity:.3}
  .mk[data-cat="餐饮"] .mk-pin{background:#C1741A}
  .mk[data-cat="办事"] .mk-pin{background:#C0111D}
  .mk[data-cat="医疗"] .mk-pin{background:#1D7A55}
  .mk[data-cat="生活"] .mk-pin{background:#54687F}
  .mk[data-cat="运动"] .mk-pin{background:#14708C}
  .mk[data-cat="出入口"] .mk-pin{background:#8A6A2F}
  .mk[data-cat="学院"] .mk-pin{background:#3C4E93}
  .mk[data-cat="场馆"] .mk-pin{background:#6B4A8A}
  .mk[data-cat="文化"] .mk-pin{background:#6B4A8A}
  .mk.on .mk-pin{background:var(--red) !important}
  .map-card{position:absolute;right:18px;top:18px;width:312px;max-height:calc(100% - 36px);overflow-y:auto;border:1px solid var(--line);border-top:3px solid var(--red);background:var(--card);box-shadow:0 10px 30px rgba(8,43,85,.16);animation:card-in 180ms ease-out both}
  @keyframes card-in{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}
  .map-card[hidden]{display:none}
  .mc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 16px 10px}
  .mc-cat{color:var(--ink-3);font:11px/1.5 var(--sans);letter-spacing:.14em}
  .mc-name{margin:2px 0 0;color:var(--navy);font:400 20px/1.4 var(--serif)}
  .mc-close{flex:0 0 24px;width:24px;height:24px;border:0;background:transparent;color:var(--ink-3);font:18px/1 var(--sans);cursor:pointer;padding:0}
  .mc-close:hover{color:var(--red)}
  .mc-body{padding:0 16px 16px}
  .mc-facts{margin:0 0 12px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .mc-facts div{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:3px 0}
  .mc-facts dt{color:var(--ink-3);font-size:12px;line-height:1.8}
  .mc-facts dd{margin:0;color:var(--ink-2);font-size:13px;line-height:1.8;word-break:break-word}
  .mc-desc{margin:0 0 12px;color:var(--ink-2);font-size:13px;line-height:1.9}
  .mc-route{margin:0 0 14px;padding:10px 12px;background:var(--bg);border-left:2px solid var(--navy);color:var(--ink-2);font-size:13px;line-height:1.85}
  .mc-route b{display:block;margin-bottom:2px;color:var(--navy);font-size:11px;letter-spacing:.14em;font-weight:700}
  .mc-actions{display:flex;gap:8px}
  .mc-btn{flex:1;height:34px;border:1px solid var(--navy);background:var(--navy);color:var(--card);font:13px/1 var(--sans);border-radius:2px;cursor:pointer;transition:opacity 160ms ease-out}
  .mc-btn.ghost{background:var(--card);color:var(--navy)}
  .mc-btn:hover{opacity:.82}
  .map-ctrl{position:absolute;left:18px;bottom:44px;display:flex;flex-direction:column;border:1px solid var(--line);background:var(--card);box-shadow:0 2px 10px rgba(8,43,85,.1)}
  .map-ctrl button{width:34px;height:34px;border:0;border-bottom:1px solid var(--line);background:var(--card);color:var(--navy);font:16px/1 var(--sans);cursor:pointer}
  .map-ctrl button:last-child{border-bottom:0}
  .map-ctrl button:hover{background:var(--bg)}
  .map-credit{position:absolute;left:18px;bottom:14px;color:var(--ink-3);font-size:11px;line-height:1.6;pointer-events:none}
  .map-hint{position:absolute;left:50%;top:16px;transform:translateX(-50%);padding:5px 12px;background:rgba(11,59,114,.9);color:var(--card);font-size:12px;border-radius:2px;opacity:0;transition:opacity 240ms ease-out;pointer-events:none}
  .map-hint.show{opacity:1}

  /* ===== 问答页的地点卡 ===== */
  .place-card{margin-top:20px;border:1px solid var(--line);border-left:3px solid var(--navy);background:var(--card);padding:16px 18px;animation:answer-in 220ms ease-out both}
  .place-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
  .place-card-title{margin:0;color:var(--navy);font:400 18px/1.5 var(--serif)}
  .place-card-cat{color:var(--ink-3);font:11px/1.5 var(--sans);letter-spacing:.14em}
  .place-card-facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 10px;padding:0;list-style:none;color:var(--ink-2);font-size:13px;line-height:1.8}
  .place-card-facts b{color:var(--ink-3);font-weight:400;margin-right:5px;font-size:12px}
  .place-card-desc{margin:0 0 10px;color:var(--ink-2);font-size:13px;line-height:1.9}
  .place-card-route{margin:0 0 12px;padding:9px 12px;background:var(--bg);color:var(--ink-2);font-size:13px;line-height:1.85;border-left:2px solid var(--navy)}
  .place-card-opt{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;padding:0;list-style:none}
  .place-opt{padding:3px 10px;border:1px solid var(--line);border-radius:2px;background:var(--card);color:var(--ink-2);font-size:12px;cursor:pointer}
  .place-opt:hover{border-color:var(--navy);color:var(--navy)}
  .place-card-go{height:34px;padding:0 16px;border:1px solid var(--navy);background:var(--navy);color:var(--card);font:13px/1 var(--sans);border-radius:2px;cursor:pointer}
  .place-card-go.ghost{background:var(--card);color:var(--navy)}
  .place-card-acts{display:flex;flex-wrap:wrap;gap:8px}

  /* ===== 问答页内嵌位置示意图 ===== */
  .ask-map{margin-top:20px;border:1px solid var(--line);border-left:3px solid var(--navy);background:var(--card);animation:answer-in 220ms ease-out both}
  .ask-map[hidden]{display:none}
  .ask-map-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line)}
  .ask-map-title{margin:0;padding-left:10px;border-left:3px solid var(--red);color:var(--navy);font:700 12px/1.4 var(--sans);letter-spacing:.15em}
  .ask-map-tools{display:flex;align-items:center;gap:6px}
  .am-btn{height:28px;padding:0 10px;border:1px solid var(--line);border-radius:2px;background:var(--card);color:var(--navy);font:13px/1 var(--sans);cursor:pointer}
  .am-btn:hover{background:var(--bg)}
  .am-btn.solid{border-color:var(--navy);background:var(--navy);color:var(--card)}
  .ask-map-canvas{position:relative;height:400px;overflow:hidden;background:#E9ECF0;cursor:grab;touch-action:none}
  .ask-map-canvas.dragging{cursor:grabbing}
  .mini-stage{position:absolute;top:0;left:0;width:100%;height:100%;transform-origin:0 0;will-change:transform}
  .mini-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;user-select:none;-webkit-user-drag:none;pointer-events:none}
  .mini-markers{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .mini-note{position:absolute;left:14px;right:14px;bottom:12px;padding:9px 12px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-left:3px solid var(--red);color:var(--ink-2);font-size:13px;line-height:1.8;pointer-events:none}
  .mini-note[hidden]{display:none}
  .mini-note b{color:var(--navy);font-weight:700}
  .mini-credit{position:absolute;left:14px;top:12px;color:var(--ink-3);font-size:11px;pointer-events:none}
  @media(max-width:639px){.ask-map-canvas{height:290px}}

  @media(max-width:900px){
    body[data-view="map"] .map-shell{grid-template-columns:240px 1fr}
    .map-card{width:280px}
  }
  @media(max-width:760px){
    body[data-view="map"]{overflow:auto}
    body[data-view="map"] .map-shell{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:calc(100vh - 75px)}
    .map-side{border-right:0;border-bottom:1px solid var(--line);max-height:42vh}
    .map-card{right:10px;left:10px;width:auto;top:10px;max-height:52%}
    .map-ctrl{left:10px;bottom:34px}
    .map-credit{left:10px;bottom:8px}
  }

<script>
const EXAMPLES=["保研需要什么条件","转专业什么时候可以申请","电瓶车通行证怎么办理","请假超过三天找谁批","宿舍能用多大功率的电器","校园卡丢了怎么补办","国家奖学金的申请条件","一食堂怎么走"];
const $=s=>document.querySelector(s);const esc=v=>String(v==null?"":v).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
let status={docs:0,chunks:0};function setStats(s){status=s;const b=$("#stats");if(!s||!Number.isFinite(Number(s.docs))||!Number.isFinite(Number(s.chunks))){b.hidden=true;return}$("#statsText").textContent=`${s.docs} 份 · ${s.chunks} 段`;$("#statusDot").classList.add("online");b.hidden=false}fetch("/api/status").then(r=>{if(!r.ok)throw Error();return r.json()}).then(setStats).catch(()=>$("#stats").hidden=true);
$("#examples").innerHTML=EXAMPLES.map((x,i)=>`<button type="button" class="example"><span class="example-no">${String(i+1).padStart(2,"0")}</span><span class="example-text">${esc(x)}</span><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h9M8 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`).join("");$("#examples").onclick=e=>{const item=e.target.closest(".example");if(item){$("#question").value=item.querySelector(".example-text").textContent;ask()}};$("#askForm").onsubmit=e=>{e.preventDefault();ask()};$("#question").addEventListener("input",e=>{const ew=$("#examplesWrap");if(!ew||ew.style.display!=="none")return;const out=$("#output");if(!e.target.value.trim()&&out&&!out.innerHTML.trim())ew.style.display=""});
function escReg(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}
function coreKeywords(q){const stripped=q.replace(/请问|怎么样|怎么办|怎么|如何|是什么|什么|有哪些|哪些|多少|是否|能不能|可不可以|可以|需要|我|的|了|吗|呢|呀/g,"").replace(/\s/g,"");const allow2=q.replace(/\s/g,"").length<=6;const out=[];for(const n of [4,3,2]){if(n===2&&!allow2)continue;for(let i=0;i<=stripped.length-n;i++){const x=stripped.slice(i,i+n);if(!out.includes(x))out.push(x)}}return out.sort((a,b)=>b.length-a.length)}
function protectCites(html){const cites=[];const protectedHtml=html.replace(/\[([1-9]\d*)\]/g,(m,n)=>{const token=`\uE000C${cites.length}\uE001`;cites.push({token,n});return token});return {html:protectedHtml,cites}}
function highlightAnswer(text,q,noMap){let html=esc(text);const p=protectCites(html);html=p.html;html=html.replace(/\d+(?:\.\d+)?\s*(?:%|％|个工作日|工作日|天|日|小时|个月|年|次|元|学时|学分|人)/g,m=>`<em class="num">${m}</em>`);html=html.replace(/第[一二三四五六七八九十百]+条|禁止|不得|应当|必须|须|不予|取消|一律|严禁/g,m=>`<strong>${m}</strong>`);const words=coreKeywords(q).filter(x=>html.includes(x));if(words.length){const re=new RegExp(words.map(escReg).join("|"),"g");let hits=0;html=html.replace(re,m=>{if(hits>=5)return m;hits++;return `<span class="hl">${m}</span>`})}p.cites.forEach(c=>{const target=noMap[c.n]||c.n;html=html.replace(c.token,`<a class="cite" href="#src-${target}" data-cite="${target}">[${c.n}]</a>`)});return html}
function sentenceParts(text){return text.split("。" ).map((x,i)=>({text:x+(i<text.split("。" ).length-1?"。":""),key:x.trim()})).filter(x=>x.key)}
function evidenceData(items){const counts=new Map();const order=[];items.forEach(text=>sentenceParts(text).forEach(s=>{if(!counts.has(s.key)){counts.set(s.key,{text:s.text,count:0});order.push(s.key)}counts.get(s.key).count++}));return order.map(k=>{const s=counts.get(k);return `${esc(s.text)}${s.count>1?`<span class="dup">（原文重复 ${s.count} 次）</span>`:""}`}).join("")}
function mergedCitations(items){const groups=[];const byTitle=new Map();(items||[]).forEach(c=>{const key=c.title||`#${c.no}`;let g=byTitle.get(key);if(!g){g={...c,originalNos:[],evidenceParts:[]};byTitle.set(key,g);groups.push(g)}g.originalNos.push(c.no);if(c.evidence)g.evidenceParts.push(c.evidence)});groups.forEach(g=>{g.evidenceHtml=evidenceData(g.evidenceParts);g.sentences=[].concat.apply([],g.evidenceParts.map(sentenceParts)).map(x=>x.key).filter(x=>x.length>=20)});groups.sort((a,b)=>(Number(b.relevance)||0)-(Number(a.relevance)||0));return groups.map((g,i)=>({...g,no:i+1}));}
function sourceDetail(c){const dept=esc(c.dept||"");if(c.source==="web"){return esc(c.grade_label||"官网页面")+" · "+(c.date?esc(c.date):"抓取时间未知")}if(c.source==="handbook"){const p=[];if(dept&&dept!=="新生手册")p.push(dept);p.push(`新生手册${c.page!=null&&c.page!==""?` P${esc(c.page)}`:""}`);return p.join(" · ")}return `${dept}${dept?" · ":""}${c.date?esc(c.date):"日期未标注"}`}
function sourceTitle(c){const t=esc(c.title);return c.source!=="handbook"&&c.url?`<a href="${esc(c.url)}" target="_blank" rel="noopener">${t}</a>`:t}
function render(d){const cites=mergedCitations(d.citations);const noMap={};cites.forEach(c=>c.originalNos.forEach(n=>noMap[n]=c.no));const seen=new Map();cites.forEach(c=>{c.crossRefs=[];c.sentences.forEach(s=>{if(seen.has(s)){const n=seen.get(s);if(n!==c.no&&!c.crossRefs.includes(n))c.crossRefs.push(n)}else seen.set(s,c.no)});});let html="";const label=d.mode==="llm"?"模型归纳 · 依据原文":d.mode==="web"?"联网检索 · 源自官网页面":d.mode==="place"?"校园地点 · 位置信息":"原文摘录";html+=`<section class="answer-block"><div class="answer-label">${label}</div>${d.ok?'<span class="stamp" aria-hidden="true">已核验</span>':''}<div class="answer-text">${d.answer?highlightAnswer(d.answer,d.question||"",noMap):"现有文件中未涉及这个问题。"}</div><div class="feedback-area"><button type="button" class="feedback-btn" id="feedbackBtn">这条不准</button><div class="feedback-box" id="feedbackBox" hidden><textarea id="feedbackReason" maxlength="200" placeholder="请简要说明哪里不准确（可选）"></textarea><button type="button" class="feedback-send" id="feedbackSend">提交反馈</button><span class="feedback-status" id="feedbackStatus"></span></div></div></section>`;if(d.notice)html+=`<div class="notice">${esc(d.notice)}</div>`;if(cites.length){html+=`<section class="sources"><div class="sources-heading"><h2 class="sources-title">出处</h2><span class="sources-note">按与问题的匹配度由高到低</span></div>`;cites.forEach((c,i)=>{const pct=Math.max(0,Math.min(100,Math.round(Number(c.relevance||0)*100)));const count=c.originalNos.length>1?`<span class="source-count">共 ${c.originalNos.length} 段</span><span class="same-file">同一文件</span>`:"";const cross=c.crossRefs.length?`<div class="duplicate-cross">该表述亦见于 ${c.crossRefs.map(n=>`[${n}]`).join("、")}</div>`:"";html+=`<article class="source-item" id="src-${c.no}" style="animation-delay:${i*40}ms"><div class="source-number">${c.no}</div><div class="source-main"><div class="source-title">${sourceTitle(c)}${count}</div><div class="source-detail">${sourceDetail(c)}</div>${cross}<div class="source-score"><span>${pct}%</span><span class="score-bar"><i style="width:${pct}%"></i></span></div><details><summary>展开原文</summary><div class="evidence">${c.evidenceHtml}</div></details></div></article>`});html+=`</section>`}if(d.expanded&&d.expanded.length)html+=`<div class="expanded-note">已按同义表述扩展检索：${d.expanded.map(esc).join("、")}</div>`;if(d.places)html+=placeBlock(d.places);const ew=$("#examplesWrap");if(ew){ew.style.display="none"}$("#output").innerHTML=html;bindPlaceLinks();showAskMap(d.places||{});$("#output").querySelectorAll(".cite").forEach(a=>a.onclick=()=>{const t=$(a.getAttribute("href"));if(t){t.classList.remove("flash");void t.offsetWidth;t.classList.add("flash");t.scrollIntoView({behavior:"smooth",block:"center"});setTimeout(()=>t.classList.remove("flash"),1800)}});bindFeedback(d,cites)}
function bindFeedback(d,cites){const btn=$("#feedbackBtn"),box=$("#feedbackBox"),send=$("#feedbackSend"),statusEl=$("#feedbackStatus");if(!btn)return;btn.onclick=()=>{box.hidden=false;btn.disabled=true};send.onclick=async()=>{send.disabled=true;statusEl.textContent="正在提交…";try{const r=await fetch("/api/feedback",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({q:d.question||"",citation_titles:cites.map(c=>c.title||""),reason:$("#feedbackReason").value.trim()})});if(!r.ok)throw Error();statusEl.textContent="已反馈";send.hidden=true}catch(e){statusEl.textContent="提交失败，请稍后重试";send.disabled=false}}}async function ask(){const q=$("#question").value.trim();if(!q)return;const b=$("#askButton");b.disabled=true;$("#output").innerHTML='<div class="loading">正在检索相关制度…</div>';const ew=$("#examplesWrap");if(ew){ew.style.display="none"}const t=setTimeout(()=>{const el=$("#output .loading");if(el)el.textContent="已找到原文，正在归纳答案…"},1200);try{const r=await fetch("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({q})});if(!r.ok)throw Error();render(await r.json())}catch(e){$("#output").innerHTML='<div class="error-message">服务暂不可用，请稍后重试</div>'}finally{clearTimeout(t);b.disabled=false}}
</script>
<script>
/* ================= 校园地图 ================= */
const MAP={data:[],bbox:null,sel:null,cat:"",q:"",scale:1,tx:0,ty:0,min:1,max:5,loaded:false};
const canvasEl=()=>document.getElementById("mapCanvas");

function mapXY(p){const b=MAP.bbox;return{x:(p.lon-b.lon0)/(b.lon1-b.lon0)*100,y:(b.lat1-p.lat)/(b.lat1-b.lat0)*100}}

function focusCampus(){
  const c=canvasEl();
  if(!c||!c.clientWidth){requestAnimationFrame(focusCampus);return}
  const w=c.clientWidth,h=c.clientHeight;
  const p=MAP.data.find(x=>x.id==="library")||MAP.data[0];
  MAP.scale=1.55;
  const{x,y}=mapXY(p);
  MAP.tx=w/2-x/100*w*MAP.scale;
  MAP.ty=h/2-y/100*h*MAP.scale;
  clampPan();paint();
}

async function loadPlaces(){
  try{
    const r=await fetch("/api/places");if(!r.ok)throw Error();
    const d=await r.json();
    MAP.data=d.places||[];
    const b=d.campus.bbox;
    MAP.bbox={lon0:b[0],lat0:b[1],lon1:b[2],lat1:b[3]};
    MAP.loaded=true;
    renderCats();renderList();renderMarkers();
    const want=new URLSearchParams(location.search).get("place");
    if(want)select(want,{center:true});
    else focusCampus();
  }catch(e){
    document.getElementById("mapList").innerHTML='<div class="map-empty">地点数据加载失败，请刷新页面重试</div>';
  }
}

function renderCats(){
  const cats=[...new Set(MAP.data.map(p=>p.category))];
  document.getElementById("mapCats").innerHTML=
    `<button class="cat-chip" type="button" data-cat="" aria-pressed="${MAP.cat===""}">全部</button>`+
    cats.map(c=>`<button class="cat-chip" type="button" data-cat="${esc(c)}" aria-pressed="${MAP.cat===c}">${esc(c)}</button>`).join("");
}

function filteredPlaces(){
  const q=MAP.q.trim();
  return MAP.data.filter(p=>{
    if(MAP.cat&&p.category!==MAP.cat)return false;
    if(!q)return true;
    return (p.name+p.short+p.building+p.rooms+(p.desc||"")+(p.route||"")).indexOf(q)>=0;
  });
}

function renderList(){
  const list=filteredPlaces();
  const box=document.getElementById("mapList");
  if(!list.length){
    box.innerHTML=`<div class="map-empty">${MAP.q?`没有匹配「${esc(MAP.q)}」的地点`:"该分类下暂无地点"}</div>`;
    return;
  }
  const groups=[];
  list.forEach(p=>{
    let g=groups.find(x=>x.cat===p.category);
    if(!g){g={cat:p.category,items:[]};groups.push(g)}
    g.items.push(p);
  });
  box.innerHTML=groups.map(g=>
    `<div class="map-group"><div class="map-group-name">${esc(g.cat)}</div>`+
    g.items.map(p=>`<button class="place-row${MAP.sel===p.id?" on":""}" type="button" data-id="${p.id}">
      <span class="place-dot"></span>
      <span class="place-row-text"><span class="place-row-name">${esc(p.name)}</span>
      <span class="place-row-sub">${esc(p.building||"")}${p.floor?` · ${esc(p.floor)}`:""}</span></span>
    </button>`).join("")+`</div>`).join("");
}

function renderMarkers(){
  const show=new Set(filteredPlaces().map(p=>p.id));
  document.getElementById("markers").innerHTML=MAP.data.map(p=>{
    const{x,y}=mapXY(p);
    return `<button class="mk${show.has(p.id)?"":" dim"}${MAP.sel===p.id?" on":""}" type="button" data-id="${p.id}" data-cat="${esc(p.category)}" style="left:${x}%;top:${y}%" aria-label="${esc(p.name)}"><span class="mk-pin"></span><span class="mk-label">${esc(p.short)}</span></button>`;
  }).join("");
}

function layoutMarkers(){
  const c=canvasEl();if(!c)return;
  const w=c.clientWidth,h=c.clientHeight;
  MAP.data.forEach(p=>{
    const el=document.querySelector(`.mk[data-id="${p.id}"]`);
    if(!el)return;
    const{x,y}=mapXY(p);
    el.style.left=(MAP.tx+x/100*w*MAP.scale)+"px";
    el.style.top=(MAP.ty+y/100*h*MAP.scale)+"px";
  });
}

function paint(){
  const s=document.getElementById("mapStage");
  if(s)s.style.transform=`translate(${MAP.tx}px,${MAP.ty}px) scale(${MAP.scale})`;
  layoutMarkers();
}

function clampPan(){
  const c=canvasEl();if(!c)return;
  const w=c.clientWidth,h=c.clientHeight;
  MAP.tx=Math.min(0,Math.max(w-w*MAP.scale,MAP.tx));
  MAP.ty=Math.min(0,Math.max(h-h*MAP.scale,MAP.ty));
}

function zoomAt(cx,cy,factor){
  const ns=Math.min(MAP.max,Math.max(MAP.min,MAP.scale*factor));
  if(ns===MAP.scale)return;
  const k=ns/MAP.scale;
  MAP.tx=cx-(cx-MAP.tx)*k;
  MAP.ty=cy-(cy-MAP.ty)*k;
  MAP.scale=ns;clampPan();paint();
}

function centerOn(p){
  const c=canvasEl();if(!c)return;
  const w=c.clientWidth,h=c.clientHeight;
  MAP.scale=Math.max(MAP.scale,2.2);
  const{x,y}=mapXY(p);
  MAP.tx=w/2-x/100*w*MAP.scale;
  MAP.ty=h/2-y/100*h*MAP.scale;
  clampPan();paint();
}

function showCard(p){
  const card=document.getElementById("mapCard");
  const rows=[["建筑",p.building],["楼层",p.floor],["房间",p.rooms],["时间",p.hours]].filter(r=>r[1]);
  card.innerHTML=
   `<div class="mc-head"><div><div class="mc-cat">${esc(p.category)}</div><h3 class="mc-name">${esc(p.name)}</h3></div>
      <button class="mc-close" type="button" aria-label="关闭">×</button></div>
    <div class="mc-body">
      <dl class="mc-facts">${rows.map(r=>`<div><dt>${r[0]}</dt><dd>${esc(r[1])}</dd></div>`).join("")}</dl>
      ${p.desc?`<p class="mc-desc">${esc(p.desc)}</p>`:""}
      ${p.route?`<div class="mc-route"><b>走法</b>${esc(p.route)}</div>`:""}
      <div class="mc-actions">
        <button class="mc-btn" type="button" data-askplace="${esc(p.short)}">在问答里问它</button>
        <button class="mc-btn ghost" type="button" data-copy="${p.id}">复制位置</button>
      </div>
    </div>`;
  card.hidden=false;
}

function select(id,opts){
  opts=opts||{};
  MAP.sel=id;
  const p=MAP.data.find(x=>x.id===id);
  document.querySelectorAll(".mk").forEach(m=>m.classList.toggle("on",m.dataset.id===id));
  document.querySelectorAll(".place-row").forEach(r=>r.classList.toggle("on",r.dataset.id===id));
  if(!p){document.getElementById("mapCard").hidden=true;return}
  showCard(p);
  if(opts.center)centerOn(p);
  if(opts.scroll){
    const row=document.querySelector(`.place-row[data-id="${id}"]`);
    if(row)row.scrollIntoView({block:"nearest"});
  }
}

function flashHint(msg){
  const h=document.getElementById("mapHint");
  h.textContent=msg;h.classList.add("show");
  clearTimeout(flashHint._t);
  flashHint._t=setTimeout(()=>h.classList.remove("show"),1600);
}

/* --- 交互绑定 --- */
function initMap(){
  const c=canvasEl();
  let drag=null;

  c.addEventListener("pointerdown",e=>{
    if(e.target.closest(".mk")||e.target.closest(".map-card")||e.target.closest(".map-ctrl"))return;
    drag={x:e.clientX,y:e.clientY,tx:MAP.tx,ty:MAP.ty};
    c.setPointerCapture(e.pointerId);c.classList.add("dragging");
  });
  c.addEventListener("pointermove",e=>{
    if(!drag)return;
    MAP.tx=drag.tx+(e.clientX-drag.x);
    MAP.ty=drag.ty+(e.clientY-drag.y);
    clampPan();paint();
  });
  const endDrag=()=>{drag=null;c.classList.remove("dragging")};
  c.addEventListener("pointerup",endDrag);
  c.addEventListener("pointercancel",endDrag);

  c.addEventListener("wheel",e=>{
    e.preventDefault();
    const r=c.getBoundingClientRect();
    zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.2:1/1.2);
  },{passive:false});

  c.addEventListener("click",e=>{
    const mk=e.target.closest(".mk");
    if(mk){select(mk.dataset.id,{scroll:true});return}
    const ctl=e.target.closest(".map-ctrl button");
    if(ctl){
      const r=c.getBoundingClientRect();
      const act=ctl.dataset.act;
      if(act==="in")zoomAt(r.width/2,r.height/2,1.35);
      else if(act==="out")zoomAt(r.width/2,r.height/2,1/1.35);
      else{MAP.scale=1;MAP.tx=0;MAP.ty=0;paint();}
    }
  });

  document.getElementById("mapCard").addEventListener("click",e=>{
    if(e.target.closest(".mc-close")){
      document.getElementById("mapCard").hidden=true;
      MAP.sel=null;
      document.querySelectorAll(".mk.on").forEach(m=>m.classList.remove("on"));
      document.querySelectorAll(".place-row.on").forEach(r=>r.classList.remove("on"));
      return;
    }
    const askBtn=e.target.closest("[data-askplace]");
    if(askBtn){
      showView("ask");
      document.getElementById("question").value=askBtn.dataset.askplace+"在哪";
      ask();
      return;
    }
    const cp=e.target.closest("[data-copy]");
    if(cp){
      const p=MAP.data.find(x=>x.id===cp.dataset.copy);
      const txt=[p.name,p.building,p.floor,p.rooms,p.route].filter(Boolean).join("｜");
      navigator.clipboard.writeText(txt).then(()=>flashHint("位置信息已复制"),()=>flashHint("复制失败，请手动选择"));
    }
  });

  document.getElementById("mapList").addEventListener("click",e=>{
    const row=e.target.closest(".place-row");
    if(row)select(row.dataset.id,{center:true});
  });

  document.getElementById("mapCats").addEventListener("click",e=>{
    const chip=e.target.closest(".cat-chip");
    if(!chip)return;
    MAP.cat=chip.dataset.cat||"";
    renderCats();renderList();renderMarkers();
  });

  const input=document.getElementById("placeQuery");
  const clearBtn=document.getElementById("placeClear");
  input.addEventListener("input",()=>{
    MAP.q=input.value;
    clearBtn.hidden=!MAP.q;
    renderList();renderMarkers();
  });
  clearBtn.addEventListener("click",()=>{
    input.value="";MAP.q="";clearBtn.hidden=true;renderList();renderMarkers();input.focus();
  });

  window.addEventListener("resize",()=>{if(document.body.dataset.view==="map")paint()});
}

/* --- 视图切换 --- */
function showView(v,push){
  document.body.dataset.view=v;
  document.querySelectorAll(".nav-tab").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.view===v)));
  if(push!==false){
    const url=v==="map"?"/map":"/";
    if(location.pathname!==url)history.pushState({v},"",url);
  }
  if(v==="map"){
    if(!MAP.loaded)loadPlaces();
    else requestAnimationFrame(()=>{paint();const w=new URLSearchParams(location.search).get("place");if(w)select(w,{center:true})});
  }
}

document.querySelector(".nav-switch").addEventListener("click",e=>{
  const t=e.target.closest(".nav-tab");
  if(t)showView(t.dataset.view);
});
window.addEventListener("popstate",()=>showView(location.pathname==="/map"?"map":"ask",false));

/* ================= 问答页内嵌地图（独立实例） ================= */
const MINI={data:[],bbox:null,sel:null,scale:1,tx:0,ty:0,min:1,max:6,loaded:false,ready:false};

function miniXY(p){const b=MINI.bbox;return{x:(p.lon-b.lon0)/(b.lon1-b.lon0)*100,y:(b.lat1-p.lat)/(b.lat1-b.lat0)*100}}

async function miniEnsure(){
  if(MINI.ready)return true;
  try{
    const d=MAP.loaded&&MAP.data.length?{places:MAP.data,campus:{bbox:[MAP.bbox.lon0,MAP.bbox.lat0,MAP.bbox.lon1,MAP.bbox.lat1]}}:await (await fetch("/api/places")).json();
    MINI.data=d.places||[];
    const b=d.campus.bbox;
    MINI.bbox={lon0:b[0],lat0:b[1],lon1:b[2],lat1:b[3]};
    MINI.ready=true;MINI.loaded=true;
    return true;
  }catch(e){return false}
}

function miniPaint(){
  const c=document.getElementById("askCanvas");
  if(!c||!MINI.bbox)return;
  document.getElementById("askStage").style.transform=`translate(${MINI.tx}px,${MINI.ty}px) scale(${MINI.scale})`;
  const w=c.clientWidth,h=c.clientHeight;
  MINI.data.forEach(p=>{
    const el=document.querySelector(`#askMarkers .mk[data-id="${p.id}"]`);
    if(!el)return;
    const{x,y}=miniXY(p);
    el.style.left=(MINI.tx+x/100*w*MINI.scale)+"px";
    el.style.top=(MINI.ty+y/100*h*MINI.scale)+"px";
  });
}

function miniClamp(){
  const c=document.getElementById("askCanvas");
  if(!c||!c.clientWidth)return;
  const w=c.clientWidth,h=c.clientHeight;
  MINI.tx=Math.min(0,Math.max(w-w*MINI.scale,MINI.tx));
  MINI.ty=Math.min(0,Math.max(h-h*MINI.scale,MINI.ty));
}

function miniZoomAt(cx,cy,factor){
  const ns=Math.min(MINI.max,Math.max(MINI.min,MINI.scale*factor));
  if(ns===MINI.scale)return;
  const k=ns/MINI.scale;
  MINI.tx=cx-(cx-MINI.tx)*k;
  MINI.ty=cy-(cy-MINI.ty)*k;
  MINI.scale=ns;miniClamp();miniPaint();
}

function miniLayout(){
  const c=document.getElementById("askCanvas");
  if(!c||!c.clientWidth)return false;
  const w=c.clientWidth,h=c.clientHeight;
  // 底图是 4096×3072，按容器比例铺满；百分比坐标与像素严格对应
  document.querySelectorAll("#askMarkers .mk").forEach(el=>{
    const p=MINI.data.find(x=>x.id===el.dataset.id);
    if(!p)return;
    const{x,y}=miniXY(p);
    el.style.left=(MINI.tx+x/100*w*MINI.scale)+"px";
    el.style.top=(MINI.ty+y/100*h*MINI.scale)+"px";
  });
  return true;
}

/* 把一组地点全部框进视野 */
function miniFit(list){
  const c=document.getElementById("askCanvas");
  if(!c||!list.length)return;
  const w=c.clientWidth,h=c.clientHeight;
  if(!w)return;
  const pts=list.map(miniXY);
  const x0=Math.min(...pts.map(p=>p.x)),x1=Math.max(...pts.map(p=>p.x));
  const y0=Math.min(...pts.map(p=>p.y)),y1=Math.max(...pts.map(p=>p.y));
  const pad=14;
  const sw=Math.max((x1-x0)/100*w,60),sh=Math.max((y1-y0)/100*h,60);
  const s=Math.min((w-pad*2)/sw,(h-pad*2)/sh,3.2);
  MINI.scale=Math.max(MINI.min,Math.min(MINI.max,s));
  const cx=(x0+x1)/2,cy=(y0+y1)/2;
  MINI.tx=w/2-cx/100*w*MINI.scale;
  MINI.ty=h/2-cy/100*h*MINI.scale;
  miniClamp();miniPaint();
}

function miniFocus(p){
  const c=document.getElementById("askCanvas");
  if(!c)return;
  const w=c.clientWidth,h=c.clientHeight;
  if(!w)return;
  MINI.scale=Math.max(MINI.scale,3.2);
  const{x,y}=miniXY(p);
  MINI.tx=w/2-x/100*w*MINI.scale;
  MINI.ty=h/2-y/100*h*MINI.scale;
  miniClamp();miniPaint();
}

function miniNote(p){
  const n=document.getElementById("askNote");
  if(!p){n.hidden=true;n.innerHTML="";return}
  const rows=[p.building,p.floor,p.hours].filter(Boolean).join("　·　");
  n.innerHTML=`<b>${esc(p.name)}</b>${rows?`　${esc(rows)}`:""}${p.desc?`<br>${esc(p.desc)}`:""}${p.route?`<br>走法：${esc(p.route)}`:""}`;
  n.hidden=false;
}

function miniRenderMarkers(highlight){
  const set=new Set(highlight||[]);
  document.getElementById("askMarkers").innerHTML=MINI.data.map(p=>{
    const{x,y}=miniXY(p);
    const on=set.has(p.id);
    return `<button class="mk${on?" on":" dim"}" type="button" data-id="${p.id}" data-cat="${esc(p.category)}" aria-label="${esc(p.name)}" style="left:${x}%;top:${y}%"><span class="mk-pin"></span><span class="mk-label">${esc(p.short)}</span></button>`;
  }).join("");
  miniLayout();
}

function miniSelect(id,center){
  MINI.sel=id;
  const p=MINI.data.find(x=>x.id===id);
  document.querySelectorAll("#askMarkers .mk").forEach(m=>m.classList.toggle("on",m.dataset.id===id));
  if(!p){miniNote(null);return}
  miniNote(p);
  if(center)miniFocus(p);
}

/* 问答结果里带地点时，当场把内嵌地图展开并指到位 */
async function showAskMap(P){
  const panel=document.getElementById("askMap");
  if(!panel)return;
  const matched=(P.matched||[]).map(p=>p.id);
  const opts=(P.options||[]).map(p=>p.id);
  const near=(P.nearby||[]).map(p=>p.id);
  const all=matched.concat(opts,near);
  if(!all.length){panel.hidden=true;return}
  panel.hidden=false;
  if(!await miniEnsure()){panel.hidden=true;return}
  miniRenderMarkers(matched.length?matched:(opts.length?opts:near));
  requestAnimationFrame(()=>{
    if(!miniLayout()){requestAnimationFrame(()=>miniLayout())}
    if(matched.length){
      miniSelect(matched[0],false);
      miniFocus(MINI.data.find(x=>x.id===matched[0]));
    }else if(opts.length||near.length){
      miniSelect(null,false);
      miniFit(MINI.data.filter(x=>(opts.length?opts:near).includes(x.id)));
    }
  });
}

function initMiniMap(){
  const c=document.getElementById("askCanvas");
  if(!c)return;
  let drag=null;
  c.addEventListener("pointerdown",e=>{
    if(e.target.closest(".mk")||e.target.closest(".am-btn"))return;
    drag={x:e.clientX,y:e.clientY,tx:MINI.tx,ty:MINI.ty};
    c.setPointerCapture(e.pointerId);c.classList.add("dragging");
  });
  c.addEventListener("pointermove",e=>{
    if(!drag)return;
    MINI.tx=drag.tx+(e.clientX-drag.x);
    MINI.ty=drag.ty+(e.clientY-drag.y);
    miniClamp();miniPaint();
  });
  const end=()=>{drag=null;c.classList.remove("dragging")};
  c.addEventListener("pointerup",end);
  c.addEventListener("pointercancel",end);
  c.addEventListener("wheel",e=>{
    e.preventDefault();
    const r=c.getBoundingClientRect();
    miniZoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.2:1/1.2);
  },{passive:false});
  c.addEventListener("click",e=>{
    const mk=e.target.closest(".mk");
    if(mk){miniSelect(mk.dataset.id,false);return}
    const btn=e.target.closest(".am-btn");
    if(!btn)return;
    const r=c.getBoundingClientRect();
    const act=btn.dataset.am;
    if(act==="in")miniZoomAt(r.width/2,r.height/2,1.4);
    else if(act==="out")miniZoomAt(r.width/2,r.height/2,1/1.4);
    else if(act==="reset"){MINI.scale=1;MINI.tx=0;MINI.ty=0;miniPaint()}
    else if(act==="full"){
      const id=MINI.sel;
      showView("map");
      if(id)select(id,{center:true});
    }
  });
  window.addEventListener("resize",()=>{if(!document.getElementById("askMap").hidden)miniPaint()});
}

/* --- 问答结果里的地点卡 --- */
function placeBlock(P){
  if(P.matched&&P.matched.length){
    const p=P.matched[0];
    return `<section class="place-card">
      <div class="place-card-head">
        <h2 class="place-card-title">${esc(p.name)}</h2>
        <span class="place-card-cat">${esc(p.category)}${P.room?"　·　"+esc(P.room):""}</span>
      </div>
      <ul class="place-card-facts">
        ${p.building?`<li><b>建筑</b>${esc(p.building)}</li>`:""}
        ${p.floor?`<li><b>楼层</b>${esc(p.floor)}</li>`:""}
        ${p.hours?`<li><b>开放</b>${esc(p.hours)}</li>`:""}
      </ul>
      ${p.desc?`<p class="place-card-desc">${esc(p.desc)}</p>`:""}
      ${p.route?`<div class="place-card-route">${esc(p.route)}</div>`:""}
      <div class="place-card-acts">
        <button class="place-card-go" type="button" data-goto="${p.id}" data-full="1">打开完整地图 →</button>
        <button class="place-card-go ghost" type="button" data-here="${p.id}">在上方示意图中定位</button>
      </div>
    </section>`;
  }
  if(P.options&&P.options.length){
    return `<section class="place-card">
      <div class="place-card-head">
        <h2 class="place-card-title">校园里有 ${P.options.length} 处</h2>
        <span class="place-card-cat">点一个在上方地图上定位</span>
      </div>
      <ul class="place-card-opt">${P.options.map(o=>`<li class="place-opt" data-goto="${o.id}">${esc(o.name)}</li>`).join("")}</ul>
    </section>`;
  }
  if(P.nearby&&P.nearby.length){
    return `<section class="place-card">
      <div class="place-card-head">
        <h2 class="place-card-title">这些地方已收录</h2>
        <span class="place-card-cat">点一个在上方地图上定位</span>
      </div>
      <ul class="place-card-opt">${P.nearby.map(o=>`<li class="place-opt" data-goto="${o.id}">${esc(o.name)}</li>`).join("")}</ul>
    </section>`;
  }
  return "";
}

function bindPlaceLinks(){
  const panel=document.getElementById("askMap");
  // 候选/邻近地点：先在内嵌示意图上高亮定位，长按或点"完整地图"才跳独立页
  document.querySelectorAll("#output [data-goto]").forEach(el=>{
    el.onclick=()=>{
      const id=el.dataset.goto;
      if(el.dataset.full||panel.hidden){showView("map");select(id,{center:true});return}
      miniSelect(id,true);
      panel.scrollIntoView({behavior:"smooth",block:"nearest"});
    };
  });
  document.querySelectorAll("#output [data-here]").forEach(el=>{
    el.onclick=()=>{
      const id=el.dataset.here;
      miniSelect(id,true);
      panel.scrollIntoView({behavior:"smooth",block:"nearest"});
    };
  });
}

initMap();
initMiniMap();
showView(location.pathname==="/map"?"map":"ask",false);
if(document.body.dataset.view==="map")loadPlaces();
/* 支持 /?q=图书馆在哪 直接出结果，便于把某个问题的答案直接发给别人 */
(function(){
  const q=new URLSearchParams(location.search).get("q");
  if(q&&document.body.dataset.view==="ask"){$("#question").value=q;ask();}
})();
</script>
