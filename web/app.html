<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>政策文件助手 · 南通大学</title>
<meta name="description" content="南通大学政策文件检索：关键词查条款，提问得回答，所有结论都能追到原文。">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231F3A5F'/%3E%3Crect x='8' y='9' width='16' height='2.6' rx='1.3' fill='%23fff'/%3E%3Crect x='8' y='15' width='16' height='2.6' rx='1.3' fill='%23fff' opacity='.65'/%3E%3Crect x='8' y='21' width='9' height='2.6' rx='1.3' fill='%23fff' opacity='.35'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#FFFFFF;--side:#FAFAFA;--line:#EDEDED;--line-2:#E3E3E3;
  --ink:#111111;--ink-2:#3D3D3D;--ink-3:#8C8C8C;--ink-4:#ABABAB;
  --brand:#1F3A5F;--hover:#F0F0F1;--active:#FFFFFF;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased;display:flex}
button{font-family:inherit}

/* ---------- 侧栏 ---------- */
.side{width:248px;flex:0 0 248px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px}
.logo{width:36px;height:36px;flex:0 0 36px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font:700 15px/1 var(--sans)}
.brand-t{font-size:15px;font-weight:600;line-height:1.3}
.brand-s{font-size:11.5px;color:var(--ink-3);line-height:1.5}
.nav{padding:6px 8px;flex:1;min-height:0;overflow:auto}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;margin-bottom:2px;border:0;border-radius:8px;background:transparent;color:var(--ink-2);font-size:14px;text-align:left;cursor:pointer;transition:background-color .14s,color .14s}
.nav-item:hover{background:var(--hover)}
.nav-item.on{background:var(--active);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.nav-item svg{width:17px;height:17px;flex:0 0 17px;opacity:.75}
.nav-item.on svg{opacity:1}
.side-foot{padding:12px;border-top:1px solid var(--line);background:var(--side)}
.update-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;height:36px;border:1px solid var(--line-2);border-radius:8px;background:#fff;color:var(--ink-2);font-size:13px;cursor:pointer;transition:border-color .14s,color .14s}
.update-btn:hover{border-color:#C9C9C9;color:var(--ink)}
.update-btn:disabled{opacity:.55;cursor:default}
.update-btn svg{width:15px;height:15px}
.side-meta{margin-top:9px;font-size:11px;color:var(--ink-4);line-height:1.65}
.side-meta b{color:var(--ink-3);font-weight:600}
.side-link{display:inline-flex;align-items:center;gap:3px;margin-top:7px;font-size:11px;color:var(--ink-3);text-decoration:none}
.side-link:hover{color:var(--ink)}

/* ---------- 主区 ---------- */
main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh}
.view{flex:1;min-height:0;overflow-y:auto;display:none}
.view.on{display:block}
.view-ask.on{display:flex;flex-direction:column}
.ask-body{flex:1;min-height:0;overflow-y:auto;padding:0 24px;display:flex;flex-direction:column}
.empty{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:720px;margin:0 auto;padding:0 0 48px}
.empty h1{margin:0 0 10px;font-size:29px;line-height:1.35;font-weight:600;letter-spacing:-.2px}
.empty p{margin:0 0 26px;color:var(--ink-3);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:8px 14px;border:1px solid var(--line-2);border-radius:999px;background:#fff;color:var(--ink-2);font-size:13px;cursor:pointer;transition:border-color .14s,background-color .14s}
.chip:hover{border-color:#CFCFCF;background:#FBFBFB}

/* ---------- 输入区 ---------- */
.composer{padding:10px 24px 16px;background:var(--bg)}
.composer-in{position:relative;max-width:760px;margin:0 auto}
.composer input{width:100%;height:52px;padding:0 56px 0 16px;border:1px solid var(--line-2);border-radius:14px;background:#fff;color:var(--ink);font:14px/1.6 var(--sans);outline:0;transition:border-color .16s,box-shadow .16s}
.composer input::placeholder{color:var(--ink-4)}
.composer input:focus{border-color:#C4C4C4;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.send{position:absolute;right:8px;top:8px;width:36px;height:36px;border:0;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;cursor:pointer;transition:opacity .14s}
.send:hover{opacity:.86}
.send:disabled{opacity:.32;cursor:default}
.send svg{width:16px;height:16px}
.fineprint{max-width:760px;margin:8px auto 0;text-align:center;font-size:11px;color:var(--ink-4)}

/* ---------- 问答结果 ---------- */
.thread{max-width:760px;margin:0 auto;padding:8px 0 28px}
.turn{margin-bottom:26px}
.q-line{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.q-avatar{width:26px;height:26px;flex:0 0 26px;border-radius:50%;background:#F1F1F1;color:var(--ink-3);display:grid;place-items:center;font-size:11px;margin-top:1px}
.q-text{font-size:15px;font-weight:600;line-height:1.65;padding-top:2px}
.a-block{padding-left:36px}
.a-mode{display:inline-flex;align-items:center;gap:5px;margin-bottom:9px;padding:2px 8px;border-radius:5px;background:#F5F5F5;color:var(--ink-3);font-size:11px;line-height:1.7}
.a-text{font-size:15px;line-height:1.95;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.a-text .num{color:var(--brand);font-weight:600}
.a-text .cite{color:var(--brand);font-size:11px;font-weight:600;text-decoration:none;vertical-align:super;line-height:0;margin:0 1px;padding:0 2px;border-radius:3px;background:#EEF2F7}
.a-text .cite:hover{background:#DCE6F1}
.a-empty{color:var(--ink-3)}
.refs{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.refs-t{font-size:11.5px;color:var(--ink-3);letter-spacing:.06em;margin-bottom:8px}
.ref{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid #F4F4F4;font-size:12.5px;line-height:1.75}
.ref:last-child{border-bottom:0}
.ref:target{background:#FBFBFB}
.ref-n{flex:0 0 18px;height:18px;border-radius:4px;background:#F3F3F3;color:var(--ink-3);font:11px/18px var(--sans);text-align:center;margin-top:2px}
.ref-main{min-width:0}
.ref-title{color:var(--ink-2)}
.ref-title a{color:inherit;text-decoration:none;border-bottom:1px solid #DADADA}
.ref-title a:hover{border-bottom-color:var(--ink-3)}
.ref-meta{color:var(--ink-4);font-size:11.5px}
.skeleton{max-width:760px;margin:0 auto;padding:20px 0}
.sk{height:13px;background:#F0F0F1;border-radius:4px;margin-bottom:11px;animation:pulse 1.3s ease-in-out infinite}
.sk:nth-child(2){width:88%}.sk:nth-child(3){width:72%}
.sk-hint{margin-top:14px;color:var(--ink-4);font-size:12px}
@keyframes pulse{50%{opacity:.45}}

/* ---------- 条款检索 ---------- */
.pane{max-width:820px;margin:0 auto;padding:26px 24px 40px}
.pane-h{margin:0 0 4px;font-size:22px;font-weight:600}
.pane-sub{margin:0 0 20px;color:var(--ink-3);font-size:13px}
.pane-search{display:flex;gap:8px;margin-bottom:26px}
.pane-search input{flex:1;height:44px;padding:0 14px;border:1px solid var(--line-2);border-radius:11px;background:#fff;color:var(--ink);font:14px var(--sans);outline:0}
.pane-search input:focus{border-color:#C4C4C4}
.btn-solid{height:44px;padding:0 18px;border:0;border-radius:11px;background:#111;color:#fff;font-size:13px;cursor:pointer}
.btn-solid:disabled{opacity:.4;cursor:default}
.sec-t{display:flex;align-items:baseline;gap:8px;margin:0 0 10px;font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.08em}
.sec-t em{font-style:normal;color:var(--ink-4);font-weight:400;letter-spacing:0}
.card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:#fff;transition:border-color .14s}
.card:hover{border-color:#D8D8D8}
.card-h{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}
.card-n{flex:0 0 20px;height:20px;border-radius:5px;background:var(--brand);color:#fff;font:11px/20px var(--sans);text-align:center;margin-top:3px}
.card-t{font-size:14.5px;font-weight:600;line-height:1.6;color:var(--ink)}
.card-t a{color:inherit;text-decoration:none}
.card-t a:hover{text-decoration:underline}
.card-m{color:var(--ink-4);font-size:11.5px;margin-bottom:6px}
.card-s{color:var(--ink-2);font-size:13px;line-height:1.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clause{border-left:2px solid var(--brand);padding:2px 0 2px 14px;margin-bottom:16px}
.clause-t{font-size:14px;line-height:1.95;color:var(--ink)}
.clause-m{margin-top:6px;color:var(--ink-4);font-size:11.5px}
mark{background:#FFF2B8;color:inherit;padding:0 1px;border-radius:2px}
.blank{padding:40px 0;text-align:center;color:var(--ink-4);font-size:13px}

/* ---------- 文件库 ---------- */
.tree-wrap{display:flex;height:100%;min-height:0}
.tree{width:266px;flex:0 0 266px;border-right:1px solid var(--line);overflow-y:auto;padding:14px 10px}
.tree-h{padding:0 8px 10px;font-size:12px;color:var(--ink-3);letter-spacing:.06em}
.yr{display:flex;align-items:center;gap:6px;width:100%;padding:7px 8px;border:0;border-radius:7px;background:transparent;color:var(--ink-2);font-size:13.5px;font-weight:600;text-align:left;cursor:pointer}
.yr:hover{background:var(--hover)}
.yr svg{width:12px;height:12px;flex:0 0 12px;transition:transform .16s;color:var(--ink-4)}
.yr[aria-expanded="true"] svg{transform:rotate(90deg)}
.yr em{font-style:normal;margin-left:auto;color:var(--ink-4);font-weight:400;font-size:11px}
.depts{display:none;padding:2px 0 6px 12px}
.depts.on{display:block}
.dp{display:flex;align-items:center;gap:6px;width:100%;padding:6px 9px;border:0;border-radius:7px;background:transparent;color:var(--ink-2);font-size:13px;text-align:left;cursor:pointer;overflow:hidden}
.dp:hover{background:var(--hover)}
.dp.on{background:#EFEFEF;color:var(--ink);font-weight:600}
.dp-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dp em{font-style:normal;flex:0 0 auto;color:var(--ink-4);font-size:11px;font-weight:400}
.docs{flex:1;min-width:0;overflow-y:auto;padding:22px 26px}
.docs-h{margin:0 0 3px;font-size:19px;font-weight:600}
.docs-sub{margin:0 0 16px;color:var(--ink-3);font-size:12.5px}
.doc-row{display:flex;gap:10px;align-items:flex-start;width:100%;padding:11px 12px;border:0;border-bottom:1px solid #F4F4F4;background:transparent;text-align:left;cursor:pointer}
.doc-row:hover{background:#FBFBFB}
.doc-row:last-child{border-bottom:0}
.doc-main{min-width:0;flex:1}
.doc-t{font-size:14px;line-height:1.6;color:var(--ink)}
.doc-m{margin-top:2px;color:var(--ink-4);font-size:11.5px}
.doc-badge{flex:0 0 auto;color:var(--ink-4);font-size:11px;padding-top:3px}
.detail-back{display:inline-flex;align-items:center;gap:5px;margin-bottom:14px;border:0;background:none;color:var(--ink-3);font-size:12.5px;cursor:pointer;padding:0}
.detail-back:hover{color:var(--ink)}
.detail-t{margin:0 0 8px;font-size:19px;font-weight:600;line-height:1.5}
.detail-meta{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 0 14px;color:var(--ink-3);font-size:12.5px}
.detail-meta b{color:var(--ink-4);font-weight:400;margin-right:4px}
.detail-open{height:34px;padding:0 14px;border:1px solid var(--line-2);border-radius:8px;background:#fff;color:var(--ink-2);font-size:12.5px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.detail-open:hover{border-color:#C9C9C9}

/* ---------- 更新弹层 ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.28);display:none;place-items:center;z-index:80}
.mask.on{display:grid}
.modal{width:340px;background:#fff;border-radius:14px;padding:22px 22px 18px;box-shadow:0 18px 44px rgba(0,0,0,.18)}
.modal h3{margin:0 0 4px;font-size:15px;font-weight:600}
.modal p{margin:0 0 14px;color:var(--ink-3);font-size:12.5px}
.steps{font-size:12.5px;color:var(--ink-2);line-height:2.05;min-height:76px}
.steps div{display:flex;align-items:center;gap:7px;opacity:.35}
.steps div.done,.steps div.now{opacity:1}
.steps i{width:5px;height:5px;border-radius:50%;background:var(--ink-3);font-style:normal}
.steps div.now i{background:var(--brand)}
.bar{height:3px;border-radius:2px;background:#F0F0F1;overflow:hidden;margin:10px 0 14px}
.bar span{display:block;height:100%;width:0;background:var(--brand);transition:width .35s ease}
.modal-foot{display:flex;justify-content:flex-end;gap:8px}
.btn-ghost{height:32px;padding:0 14px;border:1px solid var(--line-2);border-radius:8px;background:#fff;color:var(--ink-2);font-size:12.5px;cursor:pointer}

/* ---------- 窄屏 ---------- */
@media(max-width:820px){
  body{flex-direction:column}
  .side{width:100%;flex:0 0 auto;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:12px 14px 8px}
  .logo{width:30px;height:30px;flex:0 0 30px;border-radius:8px;font-size:13px}
  .brand-t{font-size:14px}
  .nav{display:flex;gap:4px;padding:0 8px 8px;overflow-x:auto}
  .nav-item{width:auto;flex:0 0 auto;padding:7px 12px;font-size:13px}
  .nav-item svg{display:none}
  .side-foot{display:none}
  main{height:auto;flex:1}
  .empty{padding-top:40px}
  .tree-wrap{flex-direction:column}
  .tree{width:100%;flex:0 0 auto;max-height:40vh;border-right:0;border-bottom:1px solid var(--line)}
  .pane{padding:18px 16px 30px}
  .ask-body{padding:0 16px}
  .composer{padding:8px 16px 12px}
}
</style>
</head>
<body>

<aside class="side">
  <div class="brand">
    <div class="logo">通</div>
    <div>
      <div class="brand-t">政策文件助手</div>
      <div class="brand-s">南通大学 · 政策文件检索</div>
    </div>
  </div>
  <nav class="nav" aria-label="功能导航">
    <button class="nav-item on" type="button" data-view="ask">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.6 9.6 0 0 1-3-.5L4 21l1.6-4.4A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/></svg>
      智能问答
    </button>
    <button class="nav-item" type="button" data-view="keyword">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.6" cy="10.6" r="6.6"/><path d="M15.5 15.5 21 21"/></svg>
      条款检索
    </button>
    <button class="nav-item" type="button" data-view="tree">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 5.5a1 1 0 0 1 1-1h4l1.8 2h9.2a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1z"/></svg>
      文件库
    </button>
  </nav>
  <div class="side-foot">
    <button class="update-btn" type="button" id="updateBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4.5V9h-4.5"/></svg>
      更新文件库
    </button>
    <div class="side-meta" id="sideMeta">正在读取语料…</div>
    <a class="side-link" href="/map" target="_blank" rel="noopener">校园地图 ↗</a>
  </div>
</aside>

<main>
  <!-- 智能问答 -->
  <section class="view view-ask on" id="view-ask">
    <div class="ask-body" id="askBody">
      <div class="empty" id="askEmpty">
        <h1>有什么可以帮您？</h1>
        <p>在南通大学的政策文件里找答案，再用大白话讲清楚。</p>
        <div class="chips" id="chips"></div>
      </div>
      <div class="thread" id="thread" hidden></div>
    </div>
    <div class="composer">
      <div class="composer-in">
        <input id="askInput" type="text" maxlength="200" autocomplete="off" placeholder="问点什么，例如：转专业需要什么条件？">
        <button class="send" type="button" id="askSend" aria-label="发送">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
        </button>
      </div>
      <div class="fineprint">答案基于南通大学校内政策文件，以原文为准</div>
    </div>
  </section>

  <!-- 条款检索 -->
  <section class="view" id="view-keyword">
    <div class="pane">
      <h2 class="pane-h">条款检索</h2>
      <p class="pane-sub">输入关键词，例如「破格评审」，列出最相关的文件与条款。</p>
      <div class="pane-search">
        <input id="kwInput" type="text" autocomplete="off" placeholder="输入关键词，如：破格评审 / 学籍异动 / 科研经费">
        <button class="btn-solid" type="button" id="kwBtn">检索</button>
      </div>
      <div id="kwOut"><div class="blank">还没有检索结果</div></div>
    </div>
  </section>

  <!-- 文件库 -->
  <section class="view" id="view-tree">
    <div class="tree-wrap">
      <div class="tree">
        <div class="tree-h">按年份 · 发文部门</div>
        <div id="treeBox"><div class="blank">正在载入…</div></div>
      </div>
      <div class="docs" id="docsBox">
        <div class="blank">从左边选一个部门</div>
      </div>
    </div>
  </section>
</main>

<div class="mask" id="mask">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h3 id="mTitle">更新文件库</h3>
    <p>扫描校内文件目录，重新切块并建立索引。</p>
    <div class="steps" id="mSteps"></div>
    <div class="bar"><span id="mBar"></span></div>
    <div class="modal-foot"><button class="btn-ghost" type="button" id="mClose">关闭</button></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?"":v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CHIPS=["6类论文的定义是什么？","破格评审需要什么条件？","转专业需要什么条件？","科研经费怎么报销？"];

/* ---------- 导航 ---------- */
function setView(v){
  document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("on",b.dataset.view===v));
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s.id==="view-"+v));
  if(v==="tree"&&!TREE.loaded)loadTree();
  if(v==="ask")setTimeout(()=>$("#askInput").focus(),60);
}
document.querySelector(".nav").addEventListener("click",e=>{
  const b=e.target.closest(".nav-item");if(b)setView(b.dataset.view);
});

/* ---------- 语料统计 ---------- */
const STAT={docs:0,chunks:0};
function paintMeta(s){
  if(!s||!Number.isFinite(Number(s.docs))){$("#sideMeta").textContent="语料不可用";return}
  STAT.docs=Number(s.docs);STAT.chunks=Number(s.chunks);
  $("#sideMeta").innerHTML=`<b>${STAT.docs}</b> 份文件 · <b>${STAT.chunks}</b> 段原文<br>数据更新于 ${new Date().toLocaleDateString("zh-CN",{month:"2-digit",day:"2-digit"})} ${new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"})}`;
}
function loadStatus(){
  fetch("/api/status").then(r=>r.ok?r.json():null).then(paintMeta).catch(()=>paintMeta(null));
}

/* ---------- 智能问答 ---------- */
$("#chips").innerHTML=CHIPS.map(t=>`<button class="chip" type="button">${esc(t)}</button>`).join("");
$("#chips").addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;
  $("#askInput").value=b.textContent;ask();
});
$("#askSend").addEventListener("click",ask);
$("#askInput").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();ask()}});

function groupRefs(cites){
  const map=new Map(),out=[];
  (cites||[]).forEach(c=>{
    const k=c.title||("文件 "+(c.no||""));
    if(!map.has(k)){const g={title:k,dept:c.dept||"",date:c.date||"",url:c.url||"",source:c.source||"",nos:[]};map.set(k,g);out.push(g)}
    map.get(k).nos.push(c.no);
  });
  return out.map((g,i)=>({...g,n:i+1}));
}

async function ask(){
  const q=$("#askInput").value.trim();if(!q)return;
  const btn=$("#askSend");btn.disabled=true;
  $("#askEmpty").hidden=true;
  const th=$("#thread");th.hidden=false;
  th.insertAdjacentHTML("beforeend",`<div class="turn" id="pending"><div class="q-line"><div class="q-avatar">你</div><div class="q-text">${esc(q)}</div></div><div class="a-block"><div class="skeleton"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div><div class="sk-hint">正在检索 ${STAT.chunks||"相关"} 段原文…</div></div></div>`);
  th.scrollIntoView({block:"end",behavior:"smooth"});
  try{
    const r=await fetch("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({q})});
    if(!r.ok)throw new Error();
    const d=await r.json();
    const refs=groupRefs(d.citations);
    const noMap={};refs.forEach(g=>g.nos.forEach(n=>noMap[n]=g.n));
    const mode={llm:"模型归纳 · 依据原文",web:"联网检索 · 源自官网",place:"校园地点 · 位置信息"}[d.mode]||"原文摘录";
    const body=d.answer?highlight(d.answer,noMap):"现有文件中未涉及这个问题。";
    $("#pending").outerHTML=`<div class="turn">
      <div class="q-line"><div class="q-avatar">你</div><div class="q-text">${esc(q)}</div></div>
      <div class="a-block">
        <div class="a-mode">${esc(mode)}</div>
        <div class="a-text${d.ok?"":" a-empty"}">${body}</div>
        ${refs.length?`<div class="refs"><div class="refs-t">参考文件</div>${refs.map(g=>`
          <div class="ref" id="ref-${g.n}"><div class="ref-n">${g.n}</div><div class="ref-main">
            <div class="ref-title">${g.url?`<a href="${esc(g.url)}" target="_blank" rel="noopener">${esc(g.title)}</a>`:esc(g.title)}</div>
            <div class="ref-meta">${[g.dept,g.date].filter(Boolean).map(esc).join(" · ")||"出处未标注"}</div>
          </div></div>`).join("")}</div>`:""}
        ${d.notice?`<div class="ref-meta" style="margin-top:10px">${esc(d.notice)}</div>`:""}
      </div></div>`;
  }catch(e){
    $("#pending").outerHTML=`<div class="turn"><div class="q-line"><div class="q-avatar">你</div><div class="q-text">${esc(q)}</div></div><div class="a-block"><div class="a-text a-empty">服务暂不可用，请稍后重试。</div></div></div>`;
  }finally{
    btn.disabled=false;$("#askInput").value="";
    $("#askBody").scrollTop=$("#askBody").scrollHeight;
    th.lastElementChild.scrollIntoView({block:"nearest",behavior:"smooth"});
  }
}

function highlight(text,noMap){
  let html=esc(text);
  html=html.replace(/\[([1-9]\d*)\]/g,(m,n)=>noMap&&noMap[n]?`<a class="cite" href="#ref-${noMap[n]}">[${noMap[n]}]</a>`:m);
  html=html.replace(/\d+(?:\.\d+)?\s*(?:%|％|个工作日|工作日|天|日|小时|个月|年|次|元|学时|学分|人)/g,m=>`<span class="num">${m}</span>`);
  return html;
}

/* ---------- 条款检索 ---------- */
$("#kwBtn").addEventListener("click",kw);
$("#kwInput").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();kw()}});

function markClause(text,q){
  const t=esc(text);
  const s=q.replace(/\s/g,"");
  if(s.length<2)return t;
  // 整串优先，命中不了再退到二元组；"破格评审" 要标成一整块，不能拆成"破格"+"评审"
  const cand=new Set([s]);
  for(let i=0;i<s.length-1;i++)cand.add(s.slice(i,i+2));
  const list=[...cand].sort((a,b)=>b.length-a.length).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  return t.replace(new RegExp("("+list.join("|")+")","g"),"<mark>$1</mark>");
}

async function kw(){
  const q=$("#kwInput").value.trim();if(!q)return;
  const btn=$("#kwBtn");btn.disabled=true;
  $("#kwOut").innerHTML='<div class="blank">正在检索…</div>';
  try{
    const r=await fetch("/api/keyword?q="+encodeURIComponent(q));
    if(!r.ok)throw new Error();
    const d=await r.json();
    if(!d.ok||(!d.files.length&&!d.clauses.length)){
      $("#kwOut").innerHTML='<div class="blank">没找到相关文件。换个说法试试，或到「智能问答」里完整描述。</div>';
      return;
    }
    let html=`<div class="sec-t">最相关的文件 <em>${d.files.length} 个</em></div>`;
    html+=d.files.map((f,i)=>`<div class="card">
      <div class="card-h"><div class="card-n">${i+1}</div><div class="card-t">${f.url?`<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.title)}</a>`:esc(f.title)}</div></div>
      <div class="card-m">${[f.dept,f.date].filter(Boolean).map(esc).join(" · ")||"出处未标注"}</div>
      <div class="card-s">${esc(f.snippet||"")}</div>
    </div>`).join("");
    html+=`<div class="sec-t" style="margin-top:24px">最相关的条款 <em>${d.clauses.length} 条</em></div>`;
    html+=d.clauses.map(c=>`<div class="clause">
      <div class="clause-t">${markClause(c.text,q)}</div>
      <div class="clause-m">出处：${esc(c.title)}${[c.dept,c.date].filter(Boolean).length?" · "+[c.dept,c.date].filter(Boolean).map(esc).join(" · "):""}</div>
    </div>`).join("");
    $("#kwOut").innerHTML=html;
  }catch(e){
    $("#kwOut").innerHTML='<div class="blank">服务暂不可用，请稍后重试。</div>';
  }finally{btn.disabled=false}
}

/* ---------- 文件库 ---------- */
const TREE={loaded:false,data:null};
async function loadTree(){
  try{
    const r=await fetch("/api/tree");if(!r.ok)throw new Error();
    TREE.data=await r.json();TREE.loaded=true;
    paintTree();
  }catch(e){
    $("#treeBox").innerHTML='<div class="blank">文件库读取失败</div>';
  }
}
function paintTree(){
  const ys=TREE.data.years||[];
  if(!ys.length){$("#treeBox").innerHTML='<div class="blank">暂无文件</div>';return}
  $("#treeBox").innerHTML=ys.map((y,i)=>`
    <button class="yr" type="button" data-i="${i}" aria-expanded="${i===0}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      ${esc(y.year)} 年 <em>${y.count}</em>
    </button>
    <div class="depts${i===0?" on":""}" data-box="${i}">
      ${y.depts.map((d,j)=>`<button class="dp" type="button" data-i="${i}" data-j="${j}" title="${esc(d.name)}"><span class="dp-n">${esc(d.name)}</span><em>${d.count}</em></button>`).join("")}
    </div>`).join("");
}
$("#treeBox").addEventListener("click",e=>{
  const y=e.target.closest(".yr");
  if(y){
    const i=y.dataset.i,open=y.getAttribute("aria-expanded")==="true";
    y.setAttribute("aria-expanded",String(!open));
    document.querySelector(`.depts[data-box="${i}"]`).classList.toggle("on",!open);
    return;
  }
  const d=e.target.closest(".dp");
  if(d){
    document.querySelectorAll(".dp").forEach(x=>x.classList.remove("on"));
    d.classList.add("on");
    paintDocs(Number(d.dataset.i),Number(d.dataset.j));
  }
});
function paintDocs(i,j){
  const y=TREE.data.years[i],dp=y.depts[j];
  $("#docsBox").innerHTML=`<h2 class="docs-h">${esc(dp.name)}</h2>
    <p class="docs-sub">${esc(y.year)} 年 · ${dp.count} 份文件</p>
    ${dp.docs.map(d=>`<button class="doc-row" type="button" data-uid="${esc(d.uid)}">
      <div class="doc-main"><div class="doc-t">${esc(d.title)}</div><div class="doc-m">${[d.date,d.dept].filter(Boolean).map(esc).join(" · ")}</div></div>
      <div class="doc-badge">${d.chunks} 段</div>
    </button>`).join("")}`;
  const all={};TREE.data.years.forEach(yy=>yy.depts.forEach(dp2=>dp2.docs.forEach(dd=>all[dd.uid]=dd)));
  $("#docsBox").querySelectorAll(".doc-row").forEach(b=>{
    b.addEventListener("click",()=>paintDocDetail(all[b.dataset.uid],i,j));
  });
}
function paintDocDetail(d,i,j){
  if(!d)return;
  $("#docsBox").innerHTML=`<button class="detail-back" type="button" id="backBtn">← 返回列表</button>
    <h2 class="detail-t">${esc(d.title)}</h2>
    <div class="detail-meta">
      <span><b>发文部门</b>${esc(d.dept)}</span>
      <span><b>日期</b>${esc(d.date||"未标注")}</span>
      <span><b>原文</b>${d.chunks} 段</span>
      ${d.url?`<span><b>来源</b>官网</span>`:""}
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${d.url?`<a class="detail-open" href="${esc(d.url)}" target="_blank" rel="noopener">打开原文 ↗</a>`:""}
      <button class="detail-open" type="button" id="askThis">就这份文件提问</button>
    </div>`;
  $("#backBtn").addEventListener("click",()=>paintDocs(i,j));
  $("#askThis").addEventListener("click",()=>{
    setView("ask");$("#askInput").value="关于《"+d.title+"》，主要规定了什么？";$("#askInput").focus();
  });
}

/* ---------- 更新文件库 ---------- */
const STEPS=["扫描校内文件目录","解析文档结构","按条款切块","建立检索索引"];
$("#updateBtn").addEventListener("click",()=>{
  $("#mask").classList.add("on");
  $("#mBar").style.width="0%";
  $("#mSteps").innerHTML=STEPS.map((s,i)=>`<div data-i="${i}"><i></i>${esc(s)}</div>`).join("");
  const rows=[...$("#mSteps").children];
  let i=0;
  rows[0].classList.add("now");
  const t=setInterval(()=>{
    rows[i].classList.remove("now");rows[i].classList.add("done");
    i++;
    $("#mBar").style.width=Math.round(i/STEPS.length*100)+"%";
    if(i>=rows.length){
      clearInterval(t);
      $("#mTitle").textContent="已是最新";
      $("#mSteps").insertAdjacentHTML("beforeend",`<div class="done" style="margin-top:4px"><i></i>${STAT.docs} 份文件 · ${STAT.chunks} 段原文，无需更新</div>`);
      loadStatus();
      return;
    }
    rows[i].classList.add("now");
  },620);
});
$("#mClose").addEventListener("click",()=>{
  $("#mask").classList.remove("on");
  $("#mTitle").textContent="更新文件库";
});

/* ---------- 启动 ---------- */
loadStatus();
setTimeout(()=>$("#askInput").focus(),120);
</script>
