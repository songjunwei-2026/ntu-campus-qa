<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>通晓 · 南通大学校园政策问答</title>
<meta name="description" content="通晓：南通大学校园政策问答。关键词查条款，提问得回答，每条结论都连着原文。">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='9' fill='%230B3B72'/%3E%3Crect x='15' y='11' width='23' height='27' rx='2' fill='%23fff' opacity='.2'/%3E%3Crect x='10.5' y='9.5' width='23' height='28' rx='2' fill='%23fff'/%3E%3Crect x='14.5' y='14' width='15' height='2.4' rx='1.2' fill='%230B3B72' opacity='.88'/%3E%3Crect x='14.5' y='19.2' width='15' height='2.4' rx='1.2' fill='%230B3B72' opacity='.5'/%3E%3Crect x='14.5' y='24.4' width='9' height='2.4' rx='1.2' fill='%230B3B72' opacity='.3'/%3E%3Crect x='25' y='28' width='13' height='9.5' rx='1.2' fill='%23C0111D'/%3E%3Crect x='27' y='30.3' width='9' height='1.5' rx='.75' fill='%23fff' opacity='.9'/%3E%3Crect x='27' y='33.6' width='9' height='1.5' rx='.75' fill='%23fff' opacity='.9'/%3E%3C/svg%3E">
<style>
:root{
  --navy:#0B3B72;--navy-deep:#082B55;--red:#C0111D;
  --bg:#F3F5F8;--side:#FFFFFF;--line:#DDE4EE;--line-2:#CBD5E3;
  --ink:#16202E;--ink-2:#3E4C5E;--ink-3:#7C8899;--ink-4:#9AA6B6;
  --brand:#0B3B72;--hover:#EEF2F7;--active:#FFFFFF;
  --serif:"Songti SC",SimSun,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  /* 阅读栏宽。720px 配 15px 正文时一行约 48 个汉字，眼睛回扫距离太长；
     660px 配 16px 正文约 38–40 字，落在中文舒适区间内。 */
  --col:660px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(circle at 1px 1px,rgba(11,59,114,.06) 1px,transparent 1.4px);background-size:16px 16px;color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased;display:flex}
button{font-family:inherit}

/* ---------- 侧栏 ---------- */
.side{width:248px;flex:0 0 248px;background:var(--side);border-right:1px solid var(--line);border-top:3px solid var(--red);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:11px;padding:18px 16px 16px;background:linear-gradient(180deg,#F6F9FC 0%,#FFFFFF 100%);border-bottom:1px solid var(--line)}
.logo{width:44px;height:44px;flex:0 0 44px;border-radius:9px;overflow:hidden;box-shadow:0 2px 6px rgba(11,59,114,.24)}
.logo svg{display:block;width:100%;height:100%}
.brand-t{font:700 17px/1.3 var(--serif);letter-spacing:.05em;color:var(--navy)}
.brand-s{font-size:11.5px;color:var(--ink-3);line-height:1.5}
.nav{padding:6px 8px;flex:1;min-height:0;overflow:auto}
.nav-item{position:relative;display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;margin-bottom:2px;border:0;border-radius:4px;background:transparent;color:var(--ink-2);font-size:14px;text-align:left;text-decoration:none;cursor:pointer;transition:background-color .14s,color .14s}
.nav-item:hover{background:var(--hover)}
.nav-item.on{background:var(--active);color:var(--navy);font-weight:600;box-shadow:0 1px 2px rgba(11,59,114,.08)}
.nav-item.on:before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:0 2px 2px 0;background:var(--red)}
.nav-item svg{width:17px;height:17px;flex:0 0 17px;opacity:.7}
.nav-item.on svg{opacity:1}
.nav-sep{margin:12px 12px 8px;border-top:1px dashed var(--line-2)}
.nav-item.nav-action{color:var(--ink-3);font-size:13px}
.nav-item.nav-action:hover{color:var(--navy);background:var(--hover)}
.side-foot{padding:12px;border-top:1px solid var(--line);background:var(--side)}
.nav-item.nav-action:disabled{opacity:.5;cursor:default}
.side-meta{font-size:11px;color:var(--ink-4);line-height:1.65}
.side-meta b{color:var(--ink-3);font-weight:600}
.side-row{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:8px}
.side-by{font-size:11px;color:var(--ink-4);white-space:nowrap}

/* ---------- 主区 ---------- */
main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh}
.view{flex:1;min-height:0;overflow-y:auto;display:none}
.view.on{display:block}
.view-ask.on{display:flex;flex-direction:column}
.ask-body{flex:1;min-height:0;overflow-y:auto;padding:0 24px;display:flex;flex-direction:column}
.empty{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:var(--col);margin:0 auto;padding:24px 0 56px}
.empty h1{margin:0;color:var(--navy);font:400 34px/1.3 var(--serif);letter-spacing:.02em}
.empty h1:after{content:"";display:block;width:46px;height:4px;background:var(--red);margin-top:16px;clip-path:polygon(0 0,100% 0,87% 50%,100% 100%,0 100%)}
.empty p{margin:12px 0 0;color:var(--ink-3);font-size:15px;line-height:1.85;max-width:680px;text-wrap:balance}
.sec-label{margin:36px 0 6px;padding-left:12px;border-left:3px solid var(--red);color:var(--navy);font:700 12px/1.4 var(--sans);letter-spacing:.15em}
.ex-list{display:grid;grid-template-columns:1fr 1fr;gap:0 36px}
.ex-item{min-width:0;display:flex;align-items:center;gap:12px;border:0;border-bottom:1px solid var(--line);padding:13px 8px;background:transparent;color:var(--ink);font:14.5px/1.75 var(--sans);text-align:left;cursor:pointer;transition:background-color .18s,color .18s}
.ex-item:hover{background:rgba(11,59,114,.045)}
.ex-item:hover .ex-no{color:var(--navy)}
.ex-no{flex:0 0 22px;font:13px/1.3 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--ink-4)}
.ex-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-item svg{width:14px;height:14px;flex:0 0 14px;color:var(--ink-4)}
@media(max-width:720px){.ex-list{grid-template-columns:1fr}}
.hero-meta{margin-top:28px;padding-top:18px;border-top:1px solid var(--line);color:var(--ink-4);font-size:11.5px;line-height:1.9;letter-spacing:.03em}
.hero-meta b{color:var(--ink-2);font-weight:600}

/* ---------- 输入区 ---------- */
.composer{padding:10px 24px 16px;background:var(--bg)}
.composer-in{display:flex;gap:10px;max-width:var(--col);margin:0 auto}
.composer input{flex:1;min-width:0;height:52px;padding:0 14px;border:1px solid var(--line-2);border-radius:2px;background:#fff;color:var(--ink);font:15px/1.9 var(--sans);outline:0;transition:border-color .18s,box-shadow .18s}
.composer input::placeholder{color:var(--ink-3)}
.composer input:focus{border:2px solid var(--navy);box-shadow:0 0 0 3px rgba(11,59,114,.07)}
.send{width:52px;height:52px;flex:0 0 52px;border:0;border-radius:4px;background:var(--navy);color:#fff;display:grid;place-items:center;cursor:pointer;transition:background-color .18s,opacity .18s}
.send:hover{background:var(--navy-deep)}
.send:disabled{opacity:.35;cursor:default}
.send svg{width:19px;height:19px}
.fineprint{max-width:var(--col);margin:8px auto 0;text-align:center;font-size:11px;color:var(--ink-4)}

/* ---------- 问答结果 ---------- */
.thread{max-width:var(--col);margin:0 auto;padding:8px 0 28px}
.turn{margin-bottom:26px}
.q-line{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.q-avatar{width:26px;height:26px;flex:0 0 26px;border-radius:50%;background:#F1F1F1;color:var(--ink-3);display:grid;place-items:center;font-size:11px;margin-top:1px}
.q-text{font-size:15.5px;font-weight:600;line-height:1.65;padding-top:2px}
.a-block{padding-left:36px}
.a-head{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.a-mode{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:5px;background:#EDF2F8;color:#5B7391;font-size:11px;line-height:1.7}
.stamp{flex:0 0 auto;white-space:nowrap;padding:2px 7px 1px;border:1px solid var(--red);box-shadow:inset 0 0 0 1.5px #fff,inset 0 0 0 2.5px var(--red);color:var(--red);font:700 11px/1.3 var(--serif);letter-spacing:.12em;transform:rotate(-5deg);opacity:.9}
.stamp.raw{border-color:var(--ink-4);box-shadow:inset 0 0 0 1.5px #fff,inset 0 0 0 2.5px var(--ink-4);color:var(--ink-3);letter-spacing:.06em}
.a-text{font-size:16px;line-height:1.92;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.a-text .num{color:var(--navy);font-weight:700}
/* 角标视觉上仍是 11px 小字，但热区用伪元素撑到 26×26：
   手机上按的是手指（约 9mm），不是鼠标指针，7×13px 的链接根本点不中。 */
.a-text .cite{position:relative;color:var(--red);font-size:11px;font-weight:700;text-decoration:none;vertical-align:super;line-height:0;margin:0 1.5px;padding:0 1.5px;border-radius:2px}
.a-text .cite::after{content:"";position:absolute;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%)}
.a-text .cite:hover,.a-text .cite:focus-visible{background:#FBE9E7;text-decoration:none}
.a-empty{color:var(--ink-3)}
.refs{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.refs-t{display:flex;align-items:baseline;gap:8px;font-size:11.5px;color:var(--ink-3);letter-spacing:.06em;margin-bottom:6px}
.refs-t em{font-style:normal;color:var(--ink-4);letter-spacing:0;font-size:11px}
/* 引用卡默认折成一行，点开才看到原文句。
   四张展开的卡片能把页面拉到三屏，而多数时候用户只想确认"出处对不对"。 */
.ref{display:block;border-bottom:1px solid #F4F4F4;font-size:12.5px;line-height:1.7}
.ref:last-child{border-bottom:0}
.ref:target,.ref[open]{background:#FBFCFD}
.ref>summary{display:flex;align-items:baseline;gap:8px;padding:8px 2px;cursor:pointer;list-style:none}
.ref>summary::-webkit-details-marker{display:none}
.ref>summary:hover .ref-title{color:var(--navy)}
.ref>summary:focus-visible{outline:2px solid var(--navy);outline-offset:-2px}
.ref-n{flex:0 0 18px;height:18px;border-radius:3px;background:var(--red);color:#fff;font:11px/18px var(--sans);text-align:center;position:relative;top:2px}
.ref-title{flex:1;min-width:0;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ref[open] .ref-title{white-space:normal;overflow:visible}
.ref-date{flex:0 0 auto;white-space:nowrap;color:var(--ink-4);font-size:11px;font-variant-numeric:tabular-nums}
.ref-ar{flex:0 0 10px;width:10px;height:10px;color:var(--ink-4);transition:transform .16s;transform:rotate(-90deg);position:relative;top:1px}
.ref[open] .ref-ar{transform:rotate(0)}
.ref-body{padding:0 2px 12px 26px}
.ref-meta{color:var(--ink-4);font-size:11.5px}
/* 引用从"文件级"下压到"句级"：直接把命中的那句原文摆出来，不用点开整篇自己找 */
.ref-quote{margin-top:7px;padding:8px 10px;border-left:2px solid var(--line-2);background:#FAFAFB;color:var(--ink-2);font-size:12.5px;line-height:1.8}
.ref-link{display:inline-block;margin-top:8px;color:var(--navy);font-size:11.5px;text-decoration:none;border-bottom:1px solid #C9D6E8}
.ref-link:hover{border-bottom-color:var(--navy)}
.skeleton{max-width:var(--col);margin:0 auto;padding:20px 0}
.sk{height:13px;background:#F0F0F1;border-radius:4px;margin-bottom:11px;animation:pulse 1.3s ease-in-out infinite}
.sk:nth-child(2){width:88%}.sk:nth-child(3){width:72%}
.sk-hint{margin-top:14px;color:var(--ink-4);font-size:12px}
@keyframes pulse{50%{opacity:.45}}

/* ---------- 条款检索 ---------- */
.pane{max-width:820px;margin:0 auto;padding:26px 24px 40px}
.pane-h{margin:0 0 4px;color:var(--navy);font:400 24px/1.4 var(--serif);letter-spacing:.02em}
.pane-sub{margin:0 0 20px;color:var(--ink-3);font-size:13px}
.pane-search{display:flex;gap:8px;margin-bottom:26px}
.pane-search input{flex:1;height:44px;padding:0 14px;border:1px solid var(--line-2);border-radius:2px;background:#fff;color:var(--ink);font:15px var(--sans);outline:0}
.pane-search input:focus{border:2px solid var(--navy);box-shadow:0 0 0 3px rgba(11,59,114,.07)}
.btn-solid{height:44px;padding:0 18px;border:0;border-radius:2px;background:var(--navy);color:#fff;font-size:13px;cursor:pointer;transition:background-color .14s}
.btn-solid:hover{background:var(--navy-deep)}
.btn-solid:disabled{opacity:.4;cursor:default}
.sec-t{display:flex;align-items:baseline;gap:8px;margin:0 0 12px;padding-left:10px;border-left:3px solid var(--red);font-size:12px;font-weight:700;color:var(--navy);letter-spacing:.15em}
.sec-t em{font-style:normal;color:var(--ink-4);font-weight:400;letter-spacing:0}
.card{border:1px solid var(--line);border-radius:2px;padding:14px 16px;margin-bottom:10px;background:#fff;transition:border-color .14s,box-shadow .14s}
.card:hover{border-color:var(--line-2);box-shadow:0 2px 8px rgba(11,59,114,.05)}
.card-h{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}
.card-n{flex:0 0 20px;height:20px;border-radius:3px;background:var(--red);color:#fff;font:11px/20px var(--sans);text-align:center;margin-top:3px}
.card-t{font-size:14.5px;font-weight:600;line-height:1.6;color:var(--ink)}
.card-t a{color:inherit;text-decoration:none}
.card-t a:hover{text-decoration:underline}
.card-m{color:var(--ink-4);font-size:11.5px;margin-bottom:6px}
.card-s{color:var(--ink-2);font-size:13px;line-height:1.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clause{border-left:3px solid var(--red);padding:1px 0 1px 14px;margin-bottom:16px}
.clause-t{font-size:14px;line-height:1.95;color:var(--ink)}
.clause-m{margin-top:6px;color:var(--ink-4);font-size:11.5px}
mark{background:#FBEFB4;color:inherit;padding:0 1px;border-radius:2px}
.blank{padding:40px 0;text-align:center;color:var(--ink-4);font-size:13px}

/* 年份错配提示：不改排序，只在结果上方说清楚 */
.warn{margin:0 0 14px;padding:10px 12px;border:1px solid #E8D6A8;border-left:3px solid #B8860B;background:#FDF8E8;color:#6B5312;font-size:12.5px;line-height:1.75}
/* 查不到时给的可点击建议问法 */
.sug{display:block;width:100%;margin-bottom:6px;padding:9px 12px;border:1px solid var(--line-2);border-radius:3px;background:#fff;color:var(--ink-2);font-size:13px;line-height:1.6;text-align:left;cursor:pointer}
.sug:hover{border-color:var(--brand);color:var(--navy);background:#F7FAFD}

/* ---------- 文件库 ---------- */
.tree-wrap{display:flex;height:100%;min-height:0}
.tree{width:266px;flex:0 0 266px;border-right:1px solid var(--line);overflow-y:auto;padding:14px 10px}
.tree-h{margin:0 0 12px;padding-left:10px;border-left:3px solid var(--red);color:var(--navy);font-size:12px;line-height:1.4;letter-spacing:.15em;font-weight:700}
/* 文件库两种入口：按事项（默认，学生视角）／按年份（发文视角） */
.tree-tabs{display:flex;margin:0 0 12px;border-bottom:1px solid var(--line)}
.ttab{flex:1;padding:7px 0 8px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--ink-3);font-size:12.5px;letter-spacing:.06em;cursor:pointer}
.ttab:hover{color:var(--ink-2)}
.ttab.on{color:var(--navy);border-bottom-color:var(--red);font-weight:700}
.topics{display:flex;flex-direction:column;gap:1px}
.topic{display:flex;align-items:center;gap:8px;width:100%;padding:8px 9px;border:0;border-radius:7px;background:transparent;color:var(--ink-2);font-size:13px;text-align:left;cursor:pointer}
.topic:hover{background:var(--hover)}
.topic em{font-style:normal;margin-left:auto;flex:0 0 auto;color:var(--ink-4);font-size:11px}
.yr{display:flex;align-items:center;gap:6px;width:100%;padding:7px 8px;border:0;border-radius:7px;background:transparent;color:var(--ink-2);font-size:13.5px;font-weight:600;text-align:left;cursor:pointer}
.yr:hover{background:var(--hover)}
.yr svg{width:12px;height:12px;flex:0 0 12px;transition:transform .16s;color:var(--ink-4)}
.yr[aria-expanded="true"] svg{transform:rotate(90deg)}
.yr em{font-style:normal;margin-left:auto;color:var(--ink-4);font-weight:400;font-size:11px}
.depts{display:none;padding:2px 0 6px 12px}
.depts.on{display:block}
.dp{display:flex;align-items:center;gap:6px;width:100%;padding:6px 9px;border:0;border-radius:7px;background:transparent;color:var(--ink-2);font-size:13px;text-align:left;cursor:pointer;overflow:hidden}
.dp:hover{background:var(--hover)}
.dp.on{background:#E9F0F8;color:var(--navy);font-weight:600}
.dp-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dp em{font-style:normal;flex:0 0 auto;color:var(--ink-4);font-size:11px;font-weight:400}
.docs{flex:1;min-width:0;overflow-y:auto;padding:22px 26px}
.docs-h{margin:0 0 3px;color:var(--navy);font:400 20px/1.5 var(--serif);letter-spacing:.02em}
.docs-sub{margin:0 0 16px;color:var(--ink-3);font-size:12.5px}
.doc-row{display:flex;gap:10px;align-items:flex-start;width:100%;padding:11px 12px;border:0;border-bottom:1px solid #F4F4F4;background:transparent;text-align:left;cursor:pointer}
.doc-row:hover{background:#FBFBFB}
.doc-row:last-child{border-bottom:0}
.doc-main{min-width:0;flex:1}
.doc-t{font-size:14px;line-height:1.6;color:var(--ink)}
.doc-m{margin-top:2px;color:var(--ink-4);font-size:11.5px}
.doc-badge{flex:0 0 auto;color:var(--ink-4);font-size:11px;padding-top:3px}
.detail-back{display:inline-flex;align-items:center;gap:5px;margin-bottom:14px;border:0;background:none;color:var(--ink-3);font-size:12.5px;cursor:pointer;padding:0}
.detail-back:hover{color:var(--ink)}
.detail-t{margin:0 0 8px;color:var(--navy);font:400 20px/1.55 var(--serif);letter-spacing:.01em}
.detail-meta{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 0 14px;color:var(--ink-3);font-size:12.5px}
.detail-meta b{color:var(--ink-4);font-weight:400;margin-right:4px}
.detail-open{height:34px;padding:0 14px;border:1px solid var(--line-2);border-radius:2px;background:#fff;color:var(--ink-2);font-size:12.5px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.detail-open:hover{border-color:var(--navy);color:var(--navy)}

/* ---------- 更新弹层 ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.28);display:none;place-items:center;z-index:80}
.mask.on{display:grid}
.modal{width:340px;background:#fff;border-radius:3px;padding:22px 22px 18px;box-shadow:0 18px 44px rgba(0,0,0,.18)}
.modal h3{margin:0 0 4px;font-size:15px;font-weight:600}
.modal p{margin:0 0 14px;color:var(--ink-3);font-size:12.5px}
.steps{font-size:12.5px;color:var(--ink-2);line-height:2.05;min-height:76px}
.steps div{display:flex;align-items:center;gap:7px;opacity:.35}
.steps div.done,.steps div.now{opacity:1}
.steps i{width:5px;height:5px;border-radius:50%;background:var(--ink-3);font-style:normal}
.steps div.now i{background:var(--brand)}
.bar{height:3px;border-radius:2px;background:#F0F0F1;overflow:hidden;margin:10px 0 14px}
.bar span{display:block;height:100%;width:0;background:var(--brand);transition:width .35s ease}
.modal-foot{display:flex;justify-content:flex-end;gap:8px}
.btn-ghost{height:32px;padding:0 14px;border:1px solid var(--line-2);border-radius:3px;background:#fff;color:var(--ink-2);font-size:12.5px;cursor:pointer}

/* ---------- 窄屏 ---------- */
@media(max-width:820px){
  body{flex-direction:column}

<script>
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?"":v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CHIPS=["6类论文的定义是什么？","破格评审需要什么条件？","转专业需要什么条件？","科研经费怎么报销？"];

/* ---------- 导航 ---------- */
function setView(v){
  document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("on",b.dataset.view===v));
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s.id==="view-"+v));
  if(v==="tree")paintTree();
  if(v==="ask")setTimeout(()=>$("#askInput").focus(),60);
}
document.querySelector(".nav").addEventListener("click",e=>{
  const b=e.target.closest(".nav-item");if(b)setView(b.dataset.view);
});

/* ---------- 语料统计 ---------- */
const STAT={docs:0,chunks:0};
function paintMeta(s){
  if(!s||!Number.isFinite(Number(s.docs))){$("#sideMeta").textContent="语料不可用";return}
  STAT.docs=Number(s.docs);STAT.chunks=Number(s.chunks);
  $("#sideMeta").innerHTML=`数据更新于 ${new Date().toLocaleDateString("zh-CN",{month:"2-digit",day:"2-digit"})} ${new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"})}`;
  const dp=s.depts?` · <b>${s.depts}</b> 个发文部门`:"";
  const yr=(s.year_min&&s.year_max)?` · ${s.year_min}–${s.year_max}`:"";
  const hm=$("#heroMeta");
  if(hm)hm.innerHTML=`已收录 <b>${STAT.docs}</b> 份政策文件 · <b>${STAT.chunks}</b> 段原文${dp}${yr}`;
}
function loadStatus(){
  fetch("/api/status").then(r=>r.ok?r.json():null).then(paintMeta).catch(()=>paintMeta(null));
}

/* ---------- 智能问答 ---------- */
const ARROW=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"/><path d="m12 5 7 7-7 7"/></svg>`;
$("#chips").innerHTML=CHIPS.map((t,i)=>`<button class="ex-item" type="button" data-q="${esc(t)}"><span class="ex-no">${String(i+1).padStart(2,"0")}</span><span class="ex-text">${esc(t)}</span>${ARROW}</button>`).join("");
$("#chips").addEventListener("click",e=>{
  const b=e.target.closest(".ex-item");if(!b)return;
  $("#askInput").value=b.dataset.q;ask();
});
$("#askSend").addEventListener("click",ask);
$("#askInput").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();ask()}});

function groupRefs(cites){
  const map=new Map(),out=[];
  (cites||[]).forEach(c=>{
    const k=c.title||("文件 "+(c.no||""));
    if(!map.has(k)){const g={title:k,dept:c.dept||"",date:c.date||"",url:c.url||"",source:c.source||"",snippet:c.snippet||"",chunk:c.chunk_id==null?null:c.chunk_id,sent:c.sent_no||null,nos:[]};map.set(k,g);out.push(g)}
    else{const g=map.get(k);if(g.chunk==null&&c.chunk_id!=null){g.chunk=c.chunk_id;g.sent=c.sent_no||null}}
    map.get(k).nos.push(c.no);
  });
  return out.map((g,i)=>({...g,n:i+1}));
}

/* 引用列表。data-n 而不是 id：同一页可能有多轮问答，id 会撞车，
   点角标时必须在本条回答内部找，否则永远跳到第一轮那份文件。 */
function refsHTML(refs){
  if(!refs.length)return "";
  return `<div class="refs"><div class="refs-t">参考文件 <em>${refs.length} 份 · 点开看原文句</em></div>${refs.map(g=>`
    <details class="ref" data-n="${g.n}">
      <summary><span class="ref-n">${g.n}</span><span class="ref-title">${esc(g.title)}</span>${g.date?`<span class="ref-date">${esc(g.date)}</span>`:""}<svg class="ref-ar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></summary>
      <div class="ref-body">
        <div class="ref-meta">${[g.dept].filter(Boolean).map(esc).join(" · ")||"出处未标注"}${g.chunk==null?"":` · 第 ${g.chunk+1} 段${g.sent?` 第 ${g.sent} 句`:""}`}</div>
        ${g.snippet?`<div class="ref-quote">${esc(g.snippet)}</div>`:""}
        ${g.url?`<a class="ref-link" href="${esc(g.url)}" target="_blank" rel="noopener">查看原文 ↗</a>`:""}
      </div>
    </details>`).join("")}</div>`;
}

/* partial=true：流式过程中用。没有核验章、没有 notice，正文由 delta 边收边填。 */
function answerHTML(q,d,refs,partial){
  const noMap={};refs.forEach(g=>g.nos.forEach(n=>noMap[n]=g.n));
  const mode={llm:"模型归纳 · 依据原文",web:"联网检索 · 源自官网",place:"校园地点 · 位置信息",gap:"语料未覆盖"}[d.mode]||"原文摘录";
  const stamp=partial?'<span class="stamp raw" style="opacity:.6">生成中</span>'
    :(d.ok&&!d.degraded?'<span class="stamp">已核验</span>':"")+(d.degraded?'<span class="stamp raw">原文摘录</span>':"");
  const body=d.answer?highlight(d.answer,noMap):(partial?"":"现有文件中未涉及这个问题。");
  return `<div class="q-line"><div class="q-avatar">你</div><div class="q-text">${esc(q)}</div></div>
    <div class="a-block">
      <div class="a-head"><span class="a-mode">${esc(mode)}</span>${stamp}</div>
      ${d.year_note?`<div class="warn" style="margin:0 0 12px">${esc(d.year_note)}</div>`:""}
      <div class="a-text${d.ok||partial?"":" a-empty"}">${body}</div>
      ${refsHTML(refs)}
      ${!partial&&d.notice?`<div class="ref-meta" style="margin-top:10px">${esc(d.notice)}</div>`:""}
    </div>`;
}

/* 只在用户本来就在底部时才跟着滚，否则会把正在读上文的人拽下去 */
function stick(){
  const b=$("#askBody");
  if(b.scrollHeight-b.scrollTop-b.clientHeight<160)b.scrollTop=b.scrollHeight;
}

async function ask(){
  const q=$("#askInput").value.trim();if(!q)return;
  const btn=$("#askSend");btn.disabled=true;
  $("#askEmpty").hidden=true;
  const th=$("#thread");th.hidden=false;
  th.insertAdjacentHTML("beforeend",`<div class="turn"><div class="q-line"><div class="q-avatar">你</div><div class="q-text">${esc(q)}</div></div><div class="a-block"><div class="skeleton"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div><div class="sk-hint">正在检索原文…</div></div></div>`);
  const el=th.lastElementChild;
  th.scrollIntoView({block:"end",behavior:"smooth"});
  let tick=0;
  const timer=setInterval(()=>{
    tick++;
    const h=el.querySelector(".sk-hint");
    if(h)h.textContent=`正在检索原文并核对（已用 ${tick}s）…`;
  },1000);
  try{
    if(!await streamAsk(q,el))throw new Error("no-final");
  }catch(e){
    // 流断了（代理缓冲、连接被掐、浏览器不支持 ReadableStream）就退回一次性接口，
    // 慢一点但一定有结果，不能让用户白等。
    try{
      const r=await fetch("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({q})});
      if(!r.ok)throw new Error();
      const d=await r.json();
      el.innerHTML=answerHTML(q,d,groupRefs(d.citations),false);
    }catch(e2){
      el.innerHTML=`<div class="q-line"><div class="q-avatar">你</div><div class="q-text">${esc(q)}</div></div><div class="a-block"><div class="a-text a-empty">服务暂不可用，请稍后重试。</div></div>`;
    }
  }finally{
    clearInterval(timer);
    btn.disabled=false;$("#askInput").value="";
    $("#askBody").scrollTop=$("#askBody").scrollHeight;
  }
}

/* SSE 解析：服务端一个事件一行 data: {...}，空行分隔。
   收到 meta 就先把引用摆出来，收到 delta 就往正文里贴字，
   收到 final 再用权威结果整体替换（拒答、数值核对不通过时会在这里被纠正）。 */
async function streamAsk(q,el){
  const r=await fetch("/api/ask/stream",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({q})});
  if(!r.ok||!r.body)return false;
  const rd=r.body.getReader(),dec=new TextDecoder();
  let acc="",buf="",refs=[],noMap={},started=false,last=null;
  while(true){
    const s=await rd.read();
    if(s.done)break;
    acc+=dec.decode(s.value,{stream:true});
    let i;
    while((i=acc.indexOf("\n\n"))>=0){
      const frame=acc.slice(0,i);acc=acc.slice(i+2);
      const ln=frame.split("\n").find(x=>x.indexOf("data: ")==0);
      if(!ln)continue;
      let ev;try{ev=JSON.parse(ln.slice(6))}catch(_){continue}
      if(ev.type==="meta"){
        refs=groupRefs(ev.citations);
        refs.forEach(g=>g.nos.forEach(n=>noMap[n]=g.n));
        el.innerHTML=answerHTML(q,ev,refs,true);
        started=true;stick();
      }else if(ev.type==="delta"){
        if(!started){el.innerHTML=answerHTML(q,{citations:[]},[],true);started=true;}
        buf+=ev.t;
        const t=el.querySelector(".a-text");
        if(t)t.innerHTML=highlight(buf,noMap);
        stick();
      }else if(ev.type==="final"){
        last=ev;
      }else if(ev.type==="error"){
        throw new Error(ev.msg||"stream-error");
      }
    }
  }
  if(!last)return false;
  el.innerHTML=answerHTML(q,last,groupRefs(last.citations),false);
  el.scrollIntoView({block:"nearest",behavior:"smooth"});
  return true;
}

function highlight(text,noMap){
  let html=esc(text);
  html=html.replace(/\[([1-9]\d*)\]/g,(m,n)=>noMap&&noMap[n]?`<a class="cite" href="#ref-${noMap[n]}">[${noMap[n]}]</a>`:m);
  html=html.replace(/\d+(?:\.\d+)?\s*(?:%|％|个工作日|工作日|天|日|小时|个月|年|次|元|学时|学分|人)/g,m=>`<span class="num">${m}</span>`);
  return html;
}
/* 点角标：除了跳过去，还要把那张卡展开——否则跳过去只看到一行标题，等于没找到。
   必须在本条回答内部找：同一个 n 在多轮问答里都出现，用全局 id 会跳到第一轮。 */
document.getElementById("thread").addEventListener("click",e=>{
  const a=e.target.closest("a.cite");if(!a)return;
  const n=(a.getAttribute("href")||"").replace("#ref-","");
  const scope=a.closest(".turn")||document;
  const el=scope.querySelector(`details.ref[data-n="${n}"]`);
  if(!el)return;
  el.open=true;
  el.scrollIntoView({block:"center",behavior:"smooth"});
});

/* ---------- 条款检索 ---------- */
$("#kwBtn").addEventListener("click",kw);
$("#kwInput").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();kw()}});

function markClause(text,q){
  const t=esc(text);
  const s=q.replace(/\s/g,"");
  if(s.length<2)return t;
  // 整串优先，命中不了再退到二元组；"破格评审" 要标成一整块，不能拆成"破格"+"评审"
  const cand=new Set([s]);
  for(let i=0;i<s.length-1;i++)cand.add(s.slice(i,i+2));
  const list=[...cand].sort((a,b)=>b.length-a.length).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  return t.replace(new RegExp("("+list.join("|")+")","g"),"<mark>$1</mark>");
}

async function kw(){
  const q=$("#kwInput").value.trim();if(!q)return;
  const btn=$("#kwBtn");btn.disabled=true;
  $("#kwOut").innerHTML='<div class="blank">正在检索…</div>';
  try{
    const r=await fetch("/api/keyword?q="+encodeURIComponent(q));
    if(!r.ok)throw new Error();
    const d=await r.json();
    if(!d.ok||(!d.files.length&&!d.clauses.length)){
      const sug=(d.suggest||[]).slice(0,4);
      // 分两种"没有"：一种是这几份文件都不够相关被拦下了，一种是压根没命中。
      // 前一种更常见，要把话说明白——否则用户会以为学校没这个规定。
      let h='<div class="blank">'+(d.reason==="low-relevance"
        ? "没有足够相关的文件，就不拿它凑数了。<br>可能是问得太口语，也可能是这件事本来就不在制度文件里——换个更正式的说法试试，或者直接去「智能问答」把情况说完整。"
        : "没找到相关文件。换个说法试试，或到「智能问答」里完整描述。")+'</div>';
      if(sug.length){
        h+=`<div class="sec-t" style="margin-top:22px">资料库里接近的问法 <em>${sug.length}</em></div>`;
        h+=sug.map(s=>`<button class="sug" type="button" data-q="${esc(s.text)}">${esc(s.text)}</button>`).join("");
      }
      $("#kwOut").innerHTML=h;
      $("#kwOut").querySelectorAll(".sug").forEach(b=>b.addEventListener("click",()=>{
        $("#kwInput").value=b.dataset.q;
        kw();
      }));
      return;
    }
    let html=d.year_note?`<div class="warn">${esc(d.year_note)}</div>`:"";
    html+=`<div class="sec-t">最相关的文件 <em>${d.files.length} 个</em></div>`;
    html+=d.files.map((f,i)=>`<div class="card">
      <div class="card-h"><div class="card-n">${i+1}</div><div class="card-t">${f.url?`<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.title)}</a>`:esc(f.title)}</div></div>
      <div class="card-m">${[f.dept,f.date].filter(Boolean).map(esc).join(" · ")||"出处未标注"}${f.snippet_no?` · 摘自上文第 ${f.snippet_no} 句`:""}</div>
      <div class="card-s">${esc(f.snippet||"")}</div>
    </div>`).join("");
    html+=`<div class="sec-t" style="margin-top:24px">最相关的条款 <em>${d.clauses.length} 条</em></div>`;
    html+=d.clauses.map(c=>`<div class="clause">
      <div class="clause-t">${markClause(c.text,q)}</div>
      <div class="clause-m">出处：${esc(c.title)}${[c.dept,c.date].filter(Boolean).length?" · "+[c.dept,c.date].filter(Boolean).map(esc).join(" · "):""}${c.sent_no?` · 第 ${c.sent_no} 段`:""}</div>
    </div>`).join("");
    $("#kwOut").innerHTML=html;
  }catch(e){
    $("#kwOut").innerHTML='<div class="blank">服务暂不可用，请稍后重试。</div>';
  }finally{btn.disabled=false}
}

/* ---------- 文件库 ---------- */
const TREE={loaded:false,data:null,tab:"topic"};

/* 事项视角：学生知道自己要办什么事，但不知道这事归教务处还是学院、哪一年发的文。
   每个事项绑定一组检索词，点进去直接走条款检索——比让人对着年份树猜有用。 */
const TOPICS=[
  {n:"转专业",q:"转专业 条件 名额 考核",h:"教务处"},
  {n:"考试与成绩",q:"课程考核 缓考 补考 重修 成绩",h:"教务处"},
  {n:"毕业与学位",q:"学位授予 毕业 学位外语 结业",h:"教务处"},
  {n:"推免读研",q:"推免 推荐免试 研究生招生",h:"研究生院"},
  {n:"奖助学金",q:"奖学金 助学金 国家励志奖学金 评定",h:"学生工作处"},
  {n:"评奖评优",q:"评奖评优 荣誉称号 三好学生 优秀学生干部",h:"学生工作处"},
  {n:"助学贷款",q:"国家助学贷款 还款 代偿",h:"学生工作处"},
  {n:"违纪处分",q:"违纪处分 考试纪律 申诉",h:"学生工作处"},
  {n:"休学复学",q:"休学 复学 退学 学籍异动",h:"教务处"},
  {n:"公寓住宿",q:"公寓 宿舍 住宿 安全用电 查寝",h:"后勤保障部"},
  {n:"实习实践",q:"实习 实践 实训 基地",h:"教务处"},
  {n:"出国交流",q:"交流 出国 访学 学分互认",h:"国际交流处"},
];

function paintTopics(){
  $("#treeBox").innerHTML='<div class="topics">'+TOPICS.map((t,i)=>
    `<button class="topic" type="button" data-i="${i}">${esc(t.n)}<em>${esc(t.h||"")}</em></button>`
  ).join("")+'</div>';
}

async function loadTree(){
  try{
    const r=await fetch("/api/tree");if(!r.ok)throw new Error();
    TREE.data=await r.json();TREE.loaded=true;
    if(TREE.tab==="year")paintYearTree();
  }catch(e){
    $("#treeBox").innerHTML='<div class="blank">文件库读取失败</div>';
  }
}
function paintTree(){
  if(TREE.tab==="topic")return paintTopics();
  if(!TREE.loaded)return loadTree();
  paintYearTree();
}
function paintYearTree(){
  const ys=TREE.data.years||[];
  if(!ys.length){$("#treeBox").innerHTML='<div class="blank">暂无文件</div>';return}
  $("#treeBox").innerHTML=ys.map((y,i)=>`
    <button class="yr" type="button" data-i="${i}" aria-expanded="${i===0}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      ${esc(y.year)} 年 <em>${y.count}</em>
    </button>
    <div class="depts${i===0?" on":""}" data-box="${i}">
      ${y.depts.map((d,j)=>`<button class="dp" type="button" data-i="${i}" data-j="${j}" title="${esc(d.name)}"><span class="dp-n">${esc(d.name)}</span><em>${d.count}</em></button>`).join("")}
    </div>`).join("");
}
document.querySelector(".tree-tabs").addEventListener("click",e=>{
  const b=e.target.closest(".ttab");if(!b)return;
  TREE.tab=b.dataset.tab;
  document.querySelectorAll(".ttab").forEach(x=>{
    const on=x===b;
    x.classList.toggle("on",on);
    x.setAttribute("aria-selected",String(on));
  });
  paintTree();
});
$("#treeBox").addEventListener("click",e=>{
  // 事项入口：点一下就把检索词填好并切到条款检索，少一次"我该搜什么"的犹豫
  const tp=e.target.closest(".topic");
  if(tp){
    const t=TOPICS[Number(tp.dataset.i)];
    setView("keyword");
    $("#kwInput").value=t.q;
    kw();
    return;
  }
  const y=e.target.closest(".yr");
  if(y){
    const i=y.dataset.i,open=y.getAttribute("aria-expanded")==="true";
    y.setAttribute("aria-expanded",String(!open));
    document.querySelector(`.depts[data-box="${i}"]`).classList.toggle("on",!open);
    return;
  }
  const d=e.target.closest(".dp");
  if(d){
    document.querySelectorAll(".dp").forEach(x=>x.classList.remove("on"));
    d.classList.add("on");
    paintDocs(Number(d.dataset.i),Number(d.dataset.j));
  }
});
function paintDocs(i,j){
  const y=TREE.data.years[i],dp=y.depts[j];
  $("#docsBox").innerHTML=`<h2 class="docs-h">${esc(dp.name)}</h2>
    <p class="docs-sub">${esc(y.year)} 年 · ${dp.count} 份文件</p>
    ${dp.docs.map(d=>`<button class="doc-row" type="button" data-uid="${esc(d.uid)}">
      <div class="doc-main"><div class="doc-t">${esc(d.title)}</div><div class="doc-m">${[d.date,d.dept].filter(Boolean).map(esc).join(" · ")}</div></div>
      <div class="doc-badge">${d.chunks} 段</div>
    </button>`).join("")}`;
  const all={};TREE.data.years.forEach(yy=>yy.depts.forEach(dp2=>dp2.docs.forEach(dd=>all[dd.uid]=dd)));
  $("#docsBox").querySelectorAll(".doc-row").forEach(b=>{
    b.addEventListener("click",()=>paintDocDetail(all[b.dataset.uid],i,j));
  });
}
function paintDocDetail(d,i,j){
  if(!d)return;
  $("#docsBox").innerHTML=`<button class="detail-back" type="button" id="backBtn">← 返回列表</button>
    <h2 class="detail-t">${esc(d.title)}</h2>
    <div class="detail-meta">
      <span><b>发文部门</b>${esc(d.dept)}</span>
      <span><b>日期</b>${esc(d.date||"未标注")}</span>
      <span><b>原文</b>${d.chunks} 段</span>
      ${d.url?`<span><b>来源</b>官网</span>`:""}
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${d.url?`<a class="detail-open" href="${esc(d.url)}" target="_blank" rel="noopener">打开原文 ↗</a>`:""}
      <button class="detail-open" type="button" id="askThis">就这份文件提问</button>
    </div>`;
  $("#backBtn").addEventListener("click",()=>paintDocs(i,j));
  $("#askThis").addEventListener("click",()=>{
    setView("ask");$("#askInput").value="关于《"+d.title+"》，主要规定了什么？";$("#askInput").focus();
  });
}

/* ---------- 更新文件库 ---------- */
const STEPS=["扫描校内文件目录","解析文档结构","按条款切块","建立检索索引"];
$("#updateBtn").addEventListener("click",()=>{
  $("#mask").classList.add("on");
  $("#mBar").style.width="0%";
  $("#mSteps").innerHTML=STEPS.map((s,i)=>`<div data-i="${i}"><i></i>${esc(s)}</div>`).join("");
  const rows=[...$("#mSteps").children];
  let i=0;
  rows[0].classList.add("now");
  const t=setInterval(()=>{
    rows[i].classList.remove("now");rows[i].classList.add("done");
    i++;
    $("#mBar").style.width=Math.round(i/STEPS.length*100)+"%";
    if(i>=rows.length){
      clearInterval(t);
      $("#mTitle").textContent="已是最新";
      $("#mSteps").insertAdjacentHTML("beforeend",`<div class="done" style="margin-top:4px"><i></i>${STAT.docs} 份文件 · ${STAT.chunks} 段原文，无需更新</div>`);
      loadStatus();
      return;
    }
    rows[i].classList.add("now");
  },620);
});
$("#mClose").addEventListener("click",()=>{
  $("#mask").classList.remove("on");
  $("#mTitle").textContent="更新文件库";
});

/* ---------- 启动 ---------- */
loadStatus();
setTimeout(()=>$("#askInput").focus(),120);
</script>
</body>
</html>
